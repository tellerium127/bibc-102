ucokinase, which responds over a broader range of higher glucose concentrations."}, {"n": 6, "q": "Which enzyme cleaves fructose 1,6-bisphosphate into two three-carbon molecules?", "opts": ["Enolase", "Aldolase", "Phosphoglycerate mutase", "Phosphohexose isomerase"], "ans": "B", "why": "Aldolase splits the six-carbon sugar into DHAP and G3P."}, {"n": 7, "q": "The glyceraldehyde 3-phosphate dehydrogenase step transfers a hydride from G3P. What does this hydride reduce?", "opts": ["FAD to FADH2", "NAD+ to NADH", "NADP+ to NADPH", "ADP to ATP"], "ans": "B", "why": "The aldehyde hydrogen is transferred to NAD+, forming NADH."}, {"n": 8, "q": "Which enzyme transfers a phosphate from 1,3-bisphosphoglycerate to ADP, making ATP?", "opts": ["Phosphoglycerate kinase", "Enolase", "Pyruvate kinase", "Phosphoglycerate mutase"], "ans": "A", "why": "Phosphoglycerate kinase performs the first substrate-level phosphorylation step."}, {"n": 9, "q": "Why does the lecture say the enolase step is needed before the final ATP-making step?", "opts": ["It converts glucose to glucose 6-phosphate.", "It forms phosphoenolpyruvate, whose phosphate has a larger standard free energy of hydrolysis, which makes ATP formation exergonic enough.", "It removes the need for ATP in the pathway.", "It converts pyruvate back to lactate."], "ans": "B", "why": "Enolase converts 2-phosphoglycerate to PEP. The phosphate on PEP has a much larger standard free energy of hydrolysis (-61.9 kJ/mol) than the phosphate on 2-phosphoglycerate (-17.6 kJ/mol), which lets pyruvate kinase make ATP."}, {"n": 10, "q": "Which ATP-making mechanism does NOT require oxygen?", "opts": ["Oxidative phosphorylation", "Substrate-level phosphorylation", "Cellular respiration", "Electron transport chain activity"], "ans": "B", "why": "Substrate-level phosphorylation does not require oxygen. The other options all depend on oxygen-based respiration."}], "sa": [{"n": 11, "q": "Walk through the energy accounting of glycolysis for one glucose. Identify which steps spend ATP, which steps produce ATP, and which step produces NADH.", "a": "Steps 1 (hexokinase) and 3 (PFK) each spend one ATP, for a total of two ATP invested. Steps 7 (phosphoglycerate kinase) and 10 (pyruvate kinase) each produce ATP, and each occurs twice per glucose because glucose is split into two three-carbon pieces. That gives four ATP produced, for a net gain of two ATP. Step 6 (glyceraldehyde 3-phosphate dehydrogenase) produces NADH, two per glucose."}, {"n": 12, "q": "The lecture says the regulation of glycolysis is at phosphofructokinase rather than at hexokinase. Explain the reasoning given.", "a": "Hexokinase phosphorylates glucose as it enters the cell. This step is needed regardless, because glucose 6-phosphate can enter several pathways besides glycolysis and the phosphate also keeps glucose inside the cell. So regulating hexokinase would not control glycolysis specifically. Phosphofructokinase is the first step committed to glycolysis, since fructose 6-phosphate is phosphorylated there and its products go only into glycolysis. The second ATP is spent only once the carbon is committed, so the cell regulates PFK to avoid spending that ATP unnecessarily."}, {"n": 13, "q": "Step 6 (glyceraldehyde 3-phosphate dehydrogenase) couples an exergonic hydride transfer to an endergonic process. Describe both parts, and explain why the overall reaction can still run in the cell even though its standard free energy change is slightly positive.", "a": "The hydride transfer from G3P to NAD+ is exergonic (-43 kJ/mol for that portion). It is coupled to an endergonic addition of free inorganic phosphate to carbon 1, which forms the high-energy acyl phosphate of 1,3-bisphosphoglycerate. The overall step has a standard free energy change of +6 kJ/mol, so it is slightly endergonic. It is reversible under cellular conditions, and the cell's substrate and product concentrations can push it in either direction. The energy released by oxidation is stored in the acyl phosphate, which is then used in the next step to make ATP."}]}, {"num": 7, "title": "Fermentation and Ethanol Metabolism", "guide": "<h1 id=\"bimm-100-lecture-7-study-guide-fermentation-and-ethanol-metabolism\">BIMM 100 Lecture 7 Study Guide: Fermentation and Ethanol Metabolism</h1>\n<h2 id=\"fates-of-pyruvate\">Fates of pyruvate</h2>\n<p>Pyruvate is a central metabolic intermediate. Its catabolic fates depend on the organism and on the cell\u2019s conditions. The main options discussed are:</p>\n<ul>\n<li>Cellular respiration: pyruvate is oxidized the rest of the way to CO2 and water in the mitochondria of eukaryotes. This requires oxygen and yields 30 to 32 ATP per glucose.</li>\n<li>Lactate fermentation: pyruvate is reduced to lactate.</li>\n<li>Ethanol fermentation: pyruvate is converted to ethanol and CO2.</li>\n<li>Biosynthesis: pyruvate can be used to make amino acids and other molecules. This is not covered in the lecture.</li>\n</ul>\n<p>Glycolysis itself yields 2 ATP and 2 NADH per glucose, and it does not require oxygen. Cellular respiration requires oxygen because oxygen is the final electron acceptor at the end of the electron transport chain. Many microorganisms can carry out cellular respiration, but some can switch between it and glycolysis plus fermentation.</p>\n<h2 id=\"why-fermentation-is-needed-nad-recycling\">Why fermentation is needed: NAD+ recycling</h2>\n<p>Each glucose converted to two pyruvate by glycolysis converts two NAD+ to two NADH. Cells have a limited NAD+ supply. With oxygen present, NADH delivers its electrons to the electron transport chain and is reoxidized to NAD+. Without oxygen, or when glycolysis outpaces respiration, NADH accumulates and NAD+ runs out, which halts glycolysis. Fermentation solves this by using pyruvate (or a derivative) as an electron acceptor to reoxidize NADH to NAD+, without oxygen. The fermentation pathway can then keep running glycolysis to make ATP. Every fermentation pathway needs a dehydrogenase to transfer the hydride from NADH to the acceptor.</p>\n<h2 id=\"lactate-fermentation\">Lactate fermentation</h2>\n<p>Lactate dehydrogenase (LDH) reduces pyruvate to lactate using NADH, regenerating NAD+. This reaction is reversible and driven by concentrations. The lecturer uses vigorous exercise as an example. At a warm-up pace, oxygen delivery meets the muscle\u2019s ATP needs from glycolysis and respiration. When a person runs hard, oxygen delivery can no longer keep up with the ATP demand. The muscle then increases glycolysis, which makes extra pyruvate and ATP without oxygen. The NADH produced must be recycled, so pyruvate is converted to lactate, which accumulates. Lactate is secreted into the blood and taken up by the liver. The liver converts lactate back to pyruvate using LDH running in reverse, then uses that pyruvate to make glucose through gluconeogenesis. The glucose can replenish what was burned in the muscle.</p>\n<p>Mammals perform lactate fermentation, but the lecturer usually uses the term lactate fermentation for microorganisms. Many microorganisms secrete lactate rather than converting it back. Lactobacillus bacteria are an important example. They use lactate fermentation to survive in low-oxygen environments and produce lactic acid, which gives fermented foods their tang. Yogurt, cheese, and kimchi (made from cabbage) all depend on this process. The lecturer also notes that even when oxygen is present, some microorganisms may choose glycolysis plus fermentation over cellular respiration when glucose is abundant. The lecturer says cellular respiration carries inherent risks, particularly in the electron transport chain, that fermentation avoids.</p>\n<h2 id=\"ethanol-fermentation\">Ethanol fermentation</h2>\n<p>Ethanol fermentation is a two-step pathway that is used by a more restricted group of organisms: microbes and some small invertebrates. Plants and mammals do not carry it out.</p>\n<p>Step one: pyruvate decarboxylase removes a carboxyl group from pyruvate, releasing CO2 and forming acetaldehyde. This is the first decarboxylation reaction in the course, and it is irreversible. The enzyme has a prosthetic group, thiamine pyrophosphate (TPP), which is permanently bound to its active site.</p>\n<p>Step two: alcohol dehydrogenase transfers a hydride from NADH to acetaldehyde, forming ethanol and regenerating NAD+.</p>\n<p>Lecturer\u2019s note on fish: goldfish and carp can survive in very low-oxygen water, such as stagnant swamp water or a pond frozen over the winter. They carry out ethanol fermentation and excrete the ethanol through their gills. The lecturer describes their route as LDH converting pyruvate to lactate, followed by an alternate pyruvate decarboxylase that converts lactate to ethanol. Lactate is charged and trapped inside the fish, while ethanol can be excreted more easily.</p>\n<p>Yeast: Saccharomyces cerevisiae, brewer\u2019s yeast, evolved on rotting fruit. It carries out ethanol fermentation even in the presence of oxygen, producing ethanol at levels high enough to kill competing organisms. It can also catabolize that ethanol later as an energy source.</p>\n<p>Alcoholic beverages: all start with a carbohydrate source, such as grain or fruit, mashed and placed in an anaerobic environment, often with yeast. Fermentation produces ethanol and CO2. Beer and sparkling wines are carbonated by the CO2 from the pyruvate decarboxylase step. Distilled spirits, such as gin, vodka, and tequila, are made by distilling fermentation products. Ethanol and water form an azeotrope: the mixture distills at a boiling point between the two, so the vapor is enriched in ethanol when it condenses. Volatile compounds carried over in distillation give the spirit its color and flavor.</p>\n<h2 id=\"alcohol-metabolism-in-animals\">Alcohol metabolism in animals</h2>\n<p>This is a side topic, but it uses the same enzymes. Animals, including humans, use alcohol dehydrogenase to catabolize ethanol for energy, not to ferment it. The pathway is:</p>\n<ol type=\"1\">\n<li>Ethanol to acetaldehyde, catalyzed by alcohol dehydrogenase. This step is reversible. It transfers a hydride to NAD+, forming NADH.</li>\n<li>Acetaldehyde to acetate, catalyzed by acetaldehyde dehydrogenase. This step oxidizes the aldehyde carbon, forming another NADH, and consumes a water molecule. The lecturer ties the calories in alcohol to these oxidations.</li>\n<li>Acetate to acetyl-CoA, catalyzed by acetate thiokinase. This step consumes ATP and attaches coenzyme A. Acetyl-CoA is a central metabolic intermediate and can enter the citric acid cycle.</li>\n</ol>\n<p>For this course, students need to know that ethanol becomes acetaldehyde, acetaldehyde becomes acetate, and acetate becomes acetyl-CoA, with the enzymes and the role of NAD+ (and ATP in the last step). Details of the thiokinase mechanism are not required.</p>\n<p>Human population differences: the lecturer reports that about 80% of Asian populations carry an alcohol dehydrogenase allele encoding a faster enzyme, and about 50% carry an acetaldehyde dehydrogenase allele encoding a slower enzyme. The result is faster production of acetaldehyde and slower clearance of it, which can reach five to ten times higher levels and cause the alcohol flush reaction (flushing and redness in the skin and face), along with headache. These figures are the lecturer\u2019s and are not sourced in the transcript.</p>\n<p>Methanol and alcohol dehydrogenase: alcohol dehydrogenase has broad substrate specificity and also oxidizes isopropanol and methanol. Methanol itself is not very toxic, but alcohol dehydrogenase converts it to formaldehyde, and then to formate, both of which are highly toxic. Formaldehyde cross-links proteins. The eyes are particularly sensitive, and blindness is a symptom of methanol poisoning. Methanol is sometimes added to industrial ethanol to denature it and avoid the tax on pure ethanol. Treatment in the emergency room uses a slow intravenous drip of ethanol. Ethanol competes with methanol for the active site of alcohol dehydrogenase, which slows formation of formaldehyde and formate. The body can then excrete the methanol through the kidneys and through exhalation. The lecturer notes this works if treatment starts early enough.</p>\n<h2 id=\"key-points-to-remember\">Key points to remember</h2>\n<ul>\n<li>Fermentation exists to regenerate NAD+ so glycolysis can continue without oxygen.</li>\n<li>Lactate fermentation: LDH reduces pyruvate to lactate. Lactate is cleared by the liver, which converts it back to pyruvate and then glucose.</li>\n<li>Ethanol fermentation: pyruvate decarboxylase (with TPP) releases CO2 and forms acetaldehyde, then alcohol dehydrogenase makes ethanol.</li>\n<li>Plants and mammals do not carry out ethanol fermentation.</li>\n<li>Animal ethanol catabolism: ethanol to acetaldehyde to acetate to acetyl-CoA.</li>\n<li>Alcohol dehydrogenase also converts methanol to toxic formaldehyde and formate. Ethanol is used as a competitive substrate in treatment.</li>\n</ul>\n<h2 id=\"caveats-from-the-transcript\">Caveats from the transcript</h2>\n<p>The transcript says \u201cGhost was converted to two molecules of pyruvate,\u201d which should read glucose. The fish is written as \u201cCARB\u201d and should read carp. The lecturer says \u201cAsiotrope,\u201d which should read azeotrope. The transcript attributes the fish ethanol pathway to an \u201calternate version of pyruvate decarboxylase\u201d acting on lactate. This is the lecturer\u2019s description and should be checked against the textbook before it is used on an exam.</p>\n", "mc": [{"n": 1, "q": "Why do cells need fermentation pathways when oxygen is absent?", "opts": ["To make more glucose", "To regenerate NAD+ from NADH so that glycolysis can keep running", "To consume oxygen as a final electron acceptor", "To convert pyruvate into acetyl-CoA"], "ans": "B", "why": "Glycolysis produces NADH, and NAD+ must be regenerated for glycolysis to continue. Fermentation reoxidizes NADH without oxygen."}, {"n": 2, "q": "Which enzyme converts pyruvate to lactate?", "opts": ["Pyruvate decarboxylase", "Lactate dehydrogenase", "Alcohol dehydrogenase", "Hexokinase"], "ans": "B", "why": "Lactate dehydrogenase reduces pyruvate to lactate and oxidizes NADH to NAD+."}, {"n": 3, "q": "What is released as a gas in the first step of ethanol fermentation?", "opts": ["O2", "CO2", "H2O", "NADH"], "ans": "B", "why": "Pyruvate decarboxylase releases CO2 to form acetaldehyde."}, {"n": 4, "q": "Pyruvate decarboxylase carries a prosthetic group that is permanently bound to its active site. What is it?", "opts": ["FAD", "Thiamine pyrophosphate (TPP)", "Biotin", "NADP+"], "ans": "B", "why": "Thiamine pyrophosphate is the prosthetic group that is permanently bound to the active site of pyruvate decarboxylase."}, {"n": 5, "q": "According to the lecture, which group of organisms does NOT carry out ethanol fermentation?", "opts": ["Microbes", "Some small invertebrates", "Mammals", "Goldfish and carp"], "ans": "C", "why": "The lecture says plants and mammals do not carry out ethanol fermentation. Goldfish and carp do, which is why option D is incorrect."}, {"n": 6, "q": "During vigorous exercise, what happens to the lactate produced in muscle, according to the lecture?", "opts": ["It is burned in the muscle to make CO2.", "It is secreted into the blood, taken up by the liver, converted to pyruvate, and used to make glucose.", "It is converted to ethanol in the muscle.", "It is stored as glycogen in the muscle and never leaves the cell."], "ans": "B", "why": "The lecture describes the blood transport and liver conversion to pyruvate, followed by gluconeogenesis to replenish glucose."}, {"n": 7, "q": "In animal ethanol catabolism, what does alcohol dehydrogenase do?", "opts": ["It converts ethanol to acetaldehyde, reducing NAD+ to NADH.", "It converts acetaldehyde to ethanol.", "It converts acetate to acetyl-CoA.", "It makes ATP from ADP."], "ans": "A", "why": "In catabolism, alcohol dehydrogenase removes a hydride from ethanol, forming acetaldehyde and NADH."}, {"n": 8, "q": "Methanol is converted by alcohol dehydrogenase to formaldehyde, then to formate. Why does the lecture say ethanol is given to patients with methanol poisoning?", "opts": ["Ethanol neutralizes formate directly.", "Ethanol competes with methanol for the active site of alcohol dehydrogenase, slowing the formation of toxic products while the body clears the methanol.", "Ethanol raises the blood pH.", "Ethanol binds formaldehyde and removes it from the blood."], "ans": "B", "why": "Ethanol competes with methanol for alcohol dehydrogenase, slowing formation of formaldehyde and formate, so the body can excrete the methanol."}, {"n": 9, "q": "Why does distillation of fermentation products increase the ethanol content of distilled spirits?", "opts": ["Ethanol boils at a higher temperature than water.", "Ethanol and water form an azeotrope that distills at an intermediate boiling point, so the condensate is enriched in ethanol.", "Distillation removes all water from the mixture.", "Distillation converts acetaldehyde into ethanol."], "ans": "B", "why": "Ethanol and water form an azeotrope, so when the mixture is distilled, the condensed product contains more ethanol."}, {"n": 10, "q": "According to the lecture, what effect do the commonly occurring alcohol dehydrogenase and acetaldehyde dehydrogenase alleles in many Asian populations have?", "opts": ["Faster conversion of ethanol to acetaldehyde, and slower conversion of acetaldehyde to acetate, which can cause a buildup of acetaldehyde and flushing.", "Slower conversion of ethanol to acetaldehyde and faster conversion of acetaldehyde to acetate.", "No change in acetaldehyde levels.", "Complete loss of alcohol dehydrogenase activity."], "ans": "A", "why": "The lecture says the ADH variant is faster at making acetaldehyde and the ALDH variant is slower at converting it to acetate, leading to higher acetaldehyde levels and the alcohol flush reaction."}], "sa": [{"n": 11, "q": "Explain how lactate fermentation allows a muscle to keep making ATP during vigorous exercise when oxygen is limited. Include the role of NADH and NAD+ and the fate of the lactate.", "a": "During vigorous exercise, oxygen delivery cannot keep up with the ATP demand, so muscle cells increase glycolysis. Glycolysis converts NAD+ to NADH, and without oxygen the NADH cannot be reoxidized through the electron transport chain. If NAD+ runs out, glycolysis stops. Lactate dehydrogenase converts pyruvate to lactate and oxidizes NADH back to NAD+, so glycolysis can keep making ATP. The lactate accumulates and is secreted into the blood. The liver takes it up, converts it back to pyruvate with lactate dehydrogenase running in reverse, and uses that pyruvate to make glucose through gluconeogenesis, which replenishes the glucose that was burned."}, {"n": 12, "q": "Compare lactate fermentation and ethanol fermentation. For each, name the enzymes, the products, and whether CO2 is released.", "a": "Lactate fermentation uses lactate dehydrogenase to reduce pyruvate to lactate, consuming NADH and regenerating NAD+. It is a single enzymatic step, and no CO2 is released. Ethanol fermentation takes two steps. Pyruvate decarboxylase releases CO2 and forms acetaldehyde, using thiamine pyrophosphate. Alcohol dehydrogenase then reduces acetaldehyde to ethanol using NADH, regenerating NAD+. Its products are ethanol and CO2. Lactate fermentation is used by mammals and many microbes, while ethanol fermentation is restricted to microbes, some small invertebrates, and certain fish."}, {"n": 13, "q": "Describe the steps by which animals convert ethanol to acetyl-CoA. For each step, name the enzyme and state whether NAD+ or ATP is involved.", "a": "First, alcohol dehydrogenase converts ethanol to acetaldehyde. A hydride is transferred to NAD+, forming NADH. This step is reversible. Second, acetaldehyde dehydrogenase oxidizes acetaldehyde to acetate, forming another NADH and consuming a water molecule. Third, acetate thiokinase converts acetate to acetyl-CoA by attaching coenzyme A, and this step uses energy from ATP. Acetyl-CoA is a central metabolic intermediate that can enter the citric acid cycle."}]}, {"num": 8, "title": "The Pyruvate Dehydrogenase Complex", "guide": "<h1 id=\"bimm-100-lecture-8-study-guide-the-pyruvate-dehydrogenase-complex\">BIMM 100 Lecture 8 Study Guide: The Pyruvate Dehydrogenase Complex</h1>\n<h2 id=\"where-cellular-respiration-happens\">Where cellular respiration happens</h2>\n<p>Glycolysis occurs in the cytoplasm and does not require oxygen. Everything after glycolysis, which the lecturer calls cellular respiration, requires oxygen and takes place in the mitochondria. Pyruvate made by glycolysis must therefore be imported into the mitochondrion before respiration can begin.</p>\n<h2 id=\"mitochondrial-architecture\">Mitochondrial architecture</h2>\n<p>A mitochondrion has two membranes. The outer membrane is a lipid bilayer that is fairly permeable to small molecules because it contains pores. The inner membrane is highly convoluted, with infoldings called cristae that greatly increase its surface area. The inner membrane is impermeable: nothing crosses it unless a specific protein channel or carrier is present. The space between the two membranes is the intermembrane space (IMS). The space enclosed by the inner membrane is the matrix, where all of cellular respiration takes place. The lecturer says the inner membrane is chock full of proteins and that up to 90 percent of its mass can be protein. The transcript\u2019s wording on this figure is ambiguous, so confirm the exact number against the slides. The electron transport chain is embedded in the inner membrane.</p>\n<h2 id=\"pyruvate-import\">Pyruvate import</h2>\n<p>Pyruvate crosses the outer membrane by diffusion through pores. It cannot cross the inner membrane by simple diffusion and needs the mitochondrial pyruvate carrier, a transporter the lecturer says was identified only in 2012, even though its activity had been measured earlier.</p>\n<h2 id=\"the-pdh-reaction\">The PDH reaction</h2>\n<p>The pyruvate dehydrogenase (PDH) complex catalyzes the first step of cellular respiration inside the matrix. It is the point of no return for pyruvate entering respiration. In one reaction, pyruvate is:</p>\n<ul>\n<li>decarboxylated, releasing carbon 1 as CO2,</li>\n<li>oxidized, with a pair of electrons transferred to NAD+ to form NADH,</li>\n<li>attached to coenzyme A, forming acetyl-CoA.</li>\n</ul>\n<p>The overall reaction is strongly exergonic, with a standard free energy change of -33.4 kJ/mol, and it is irreversible. Each glucose yields two pyruvates, so the PDH complex produces 2 CO2, 2 NADH, and 2 acetyl-CoA per glucose.</p>\n<h2 id=\"coenzyme-a-and-activated-acyl-groups\">Coenzyme A and activated acyl groups</h2>\n<p>Coenzyme A (CoA) is a carrier of acyl groups. An acyl group is a carbonyl with something attached to it, and the acetyl group from pyruvate is a two-carbon acyl group. CoA\u2019s reactive group is a thiol, and the bond formed between the acyl group and this thiol is a thioester. Attaching an acyl group to CoA takes energy, which comes from the oxidation of pyruvate. That energy is stored in the thioester, so these are \u201cactivated\u201d acyl groups: breaking the thioester later releases energy that can power other reactions. CoA contains pantothenic acid, one of the B vitamins. You are expected to recognize the structure of CoA, ATP, and NAD+, but not to draw them from scratch.</p>\n<h2 id=\"why-acetyl-coa-matters-for-metabolism\">Why acetyl-CoA matters for metabolism</h2>\n<p>Acetyl-CoA is the starting point for fatty acid synthesis, which is built from two-carbon units. Fatty acid breakdown also yields acetyl-CoA. The lecturer\u2019s main point is that the body can convert carbohydrate to fat but cannot convert fat back to carbohydrate, because the PDH reaction is irreversible.</p>\n<h2 id=\"the-three-enzymes-of-the-pdh-complex\">The three enzymes of the PDH complex</h2>\n<p>The complex is a very large assembly of three enzymes, each made of multiple polypeptides, that together can be seen with an electron microscope. Hexokinase, a glycolytic enzyme, is much smaller by comparison.</p>\n<ul>\n<li><strong>E1, pyruvate dehydrogenase,</strong> uses the prosthetic group thiamine pyrophosphate (TPP). It removes CO2 from pyruvate and attaches the remaining two-carbon hydroxyethyl group to TPP.</li>\n<li><strong>E2, dihydrolipoyl transacetylase,</strong> uses CoA as a substrate and carries a lipoyl lysine arm. It transfers the acetyl group from the lipoyl arm to CoA to form acetyl-CoA.</li>\n<li><strong>E3, dihydrolipoyl dehydrogenase,</strong> uses FAD and NAD+. It passes electrons from the reduced lipoyl arm to FAD, forming FADH2, and then to NAD+, forming NADH.</li>\n</ul>\n<p>Thiamine (vitamin B1) and pantothenic acid (in CoA) are both B vitamins that serve as coenzyme building blocks in these pathways.</p>\n<h2 id=\"mechanism-step-by-step\">Mechanism, step by step</h2>\n<ol type=\"1\">\n<li><strong>TPP carbanion.</strong> A C-H carbon on TPP\u2019s thiazolium ring loses a proton, leaving a nucleophilic carbanion. It attacks pyruvate.</li>\n<li><strong>Decarboxylation.</strong> The carboxyl carbon leaves as CO2 and the electron pair stays behind, producing a hydroxyethyl group bound to TPP. This is the first enzyme-bound intermediate.</li>\n<li><strong>Transfer to the lipoyl arm.</strong> The hydroxyethyl group is passed to the oxidized lipoyl arm of E2. The two carbons become an acetyl group on a sulfur, and the lipoyl arm is reduced. This is the oxidation step; the electron pair ends up owned by sulfur.</li>\n<li><strong>Transfer to CoA.</strong> The acetyl group moves from the lipoyl arm to CoA (E2), forming acetyl-CoA. The energy comes from breaking the high-energy bond to the acetyl group.</li>\n<li><strong>Re-oxidation.</strong> The reduced lipoyl arm moves to E3, which transfers the electrons through FAD (forming FADH2) and into NAD+ to form NADH.</li>\n</ol>\n<p>The lecturer says the exact electron path through E3 is not fully understood, so the stoichiometric view is what matters: FAD takes up two hydrogens and transfers a hydride to NAD+.</p>\n<h2 id=\"the-lipoyl-arm-and-substrate-channeling\">The lipoyl arm and substrate channeling</h2>\n<p>The lipoyl lysine arm is long and flexible, with lipoic acid attached to a lysine side chain. It can take three states: oxidized (the two sulfurs form a ring, a disulfide), acetylated-reduced (carrying an acetyl group on one sulfur), and reduced (two thiols). Because it can reach the active sites of E1, E2, and E3 in turn, the arm acts like a crane that carries intermediates through the complex. This movement of intermediates from one active site to the next is called substrate channeling.</p>\n<h2 id=\"comparison-pyruvate-decarboxylase\">Comparison: pyruvate decarboxylase</h2>\n<p>Pyruvate decarboxylase also uses TPP and forms a hydroxyethyl-TPP intermediate, but it has no E2 or lipoyl arm. The hydroxyethyl group is simply released as acetaldehyde, which is the first step of ethanol fermentation in microbes and some invertebrates. The lecturer notes that mammals do not have this enzyme. This comparison illustrates that the same TPP chemistry is conserved across different enzymes.</p>\n<h2 id=\"regulation-of-the-pdh-complex\">Regulation of the PDH complex</h2>\n<p>The complex is regulated in two ways, so its activity can be turned up or down rather than switched fully on or off.</p>\n<p><strong>Allosteric regulation (all on E1).</strong> - Inhibitors signaling high energy: ATP, NADH, and acetyl-CoA (a product of the complex itself). Binding decreases E1 activity. - Activators signaling low energy: AMP, NAD+, and free CoA. Binding increases E1 activity. - The lecturer notes that AMP, rather than ADP, is the more important low-energy signal, because the cell can make ATP from two ADP molecules, producing one ATP and one AMP.</p>\n<p><strong>Regulation by phosphorylation.</strong> - PDH kinase is permanently bound to the complex and phosphorylates E1, which decreases its activity. - PDH kinase is itself allosterically activated by ATP, so high ATP leads to more phosphorylation and less PDH activity. - A protein phosphatase, also permanently bound, removes the phosphate by hydrolysis. The lecturer describes its activity as constitutive (always present at a low level). When the kinase is turned off, the phosphatase can restore PDH activity. - Protein kinases cannot put phosphate back onto ADP to make ATP. Reversing phosphorylation requires a phosphatase.</p>\n<h2 id=\"key-facts-to-remember\">Key facts to remember</h2>\n<ul>\n<li>PDH converts pyruvate to acetyl-CoA, CO2, and NADH; it is irreversible and exergonic (-33.4 kJ/mol).</li>\n<li>The mitochondrial pyruvate carrier moves pyruvate across the inner membrane.</li>\n<li>The PDH complex has E1 (TPP), E2 (CoA and lipoyl arm), and E3 (FAD and NAD+).</li>\n<li>The lipoyl arm moves intermediates between active sites (substrate channeling).</li>\n<li>Regulation: ATP, NADH, and acetyl-CoA inhibit; AMP, NAD+, and CoA activate; phosphorylation by PDH kinase (ATP-activated) inhibits.</li>\n</ul>\n", "mc": [{"n": 1, "q": "Where does the first step of cellular respiration take place?", "opts": ["Cytoplasm", "Intermembrane space", "Matrix", "Outer mitochondrial membrane"], "ans": "C", "why": "The lecturer says all of cellular respiration occurs in the matrix. Glycolysis is in the cytoplasm."}, {"n": 2, "q": "Which carrier moves pyruvate across the inner mitochondrial membrane?", "opts": ["Porin pores in the inner membrane", "The mitochondrial pyruvate carrier", "ATP synthase", "Simple diffusion through the lipid bilayer"], "ans": "B", "why": "Pyruvate can cross the outer membrane by diffusion through pores, but the inner membrane needs the mitochondrial pyruvate carrier."}, {"n": 3, "q": "Which of the following is NOT a direct product of the PDH reaction?", "opts": ["CO2", "Acetyl-CoA", "NADH", "ATP"], "ans": "D", "why": "The PDH reaction produces CO2, acetyl-CoA, and NADH. ATP is not produced in this step."}, {"n": 4, "q": "The standard free energy change of the PDH reaction is:", "opts": ["+33.4 kJ/mol", "-33.4 kJ/mol", "-3.34 kJ/mol", "0 kJ/mol"], "ans": "B", "why": "The lecturer gives -33.4 kJ/mol, which makes the reaction strongly exergonic and irreversible."}, {"n": 5, "q": "The reactive group of coenzyme A that accepts the acetyl group is:", "opts": ["A hydroxyl group", "A thiol group", "An amino group", "A phosphate group"], "ans": "B", "why": "Coenzyme A has a reactive thiol group, and the acetyl group forms a thioester bond with it."}, {"n": 6, "q": "Which enzyme of the PDH complex transfers the acetyl group from the lipoyl arm to coenzyme A?", "opts": ["E1, pyruvate dehydrogenase", "E2, dihydrolipoyl transacetylase", "E3, dihydrolipoyl dehydrogenase", "Pyruvate decarboxylase"], "ans": "B", "why": "E2, dihydrolipoyl transacetylase, uses CoA as a substrate and transfers the acetyl group from the lipoyl arm to CoA."}, {"n": 7, "q": "In the PDH complex, which prosthetic group passes electrons from the reduced lipoyl arm into NAD+?", "opts": ["Thiamine pyrophosphate (TPP)", "Heme", "FAD", "Biotin"], "ans": "C", "why": "E3, dihydrolipoyl dehydrogenase, uses FAD (which becomes FADH2) and then transfers a hydride to NAD+."}, {"n": 8, "q": "Which of the following is an allosteric activator of the PDH complex?", "opts": ["ATP", "NADH", "Acetyl-CoA", "AMP"], "ans": "D", "why": "AMP is a low-energy signal that increases PDH activity. ATP, NADH, and acetyl-CoA are inhibitors."}, {"n": 9, "q": "The lecturer says that the PDH kinase is activated by which molecule, and what does its phosphorylation of E1 do?", "opts": ["ATP; increases PDH activity", "ATP; decreases PDH activity", "AMP; decreases PDH activity", "NAD+; increases PDH activity"], "ans": "B", "why": "PDH kinase is allosterically activated by ATP. Its phosphorylation of E1 decreases PDH activity."}, {"n": 10, "q": "Pyruvate decarboxylase differs from the PDH complex because it:", "opts": ["Uses TPP and forms a hydroxyethyl-TPP intermediate", "Releases its two-carbon product as acetaldehyde, with no CoA or lipoyl arm involved", "Is found in all mammals", "Requires FAD and NAD+ to function"], "ans": "B", "why": "Pyruvate decarboxylase uses TPP to remove CO2, but the hydroxyethyl group is released as acetaldehyde (the first step of ethanol fermentation). It has no CoA or lipoyl arm. Mammals lack the enzyme, so C is wrong."}], "sa": [{"n": 11, "q": "Explain why the PDH reaction is described as the \"point of no return\" for pyruvate entering cellular respiration. Include at least two features of the reaction in your answer.", "a": "The reaction is irreversible (the lecturer gives a strongly negative standard free energy change, -33.4 kJ/mol), so pyruvate cannot be converted back. It also releases a carbon as CO2 (decarboxylation) and oxidizes pyruvate to form NADH, committing its carbons to oxidation through the rest of cellular respiration. Any two of these features are acceptable."}, {"n": 12, "q": "Describe the role of the lipoyl lysine arm in the PDH complex, including the term \"substrate channeling.\"", "a": "The lipoyl arm is a long, flexible lysine-linked lipoic acid. It can reach into the active sites of E1, E2, and E3 in turn, picking up intermediates from one and delivering them to the next. This movement of intermediates through the complex is substrate channeling. In the PDH complex, the arm carries the hydroxyethyl-derived acetyl group from E1 to E2 (where it is transferred to CoA) and carries electrons from E2 to E3."}, {"n": 13, "q": "The PDH complex can be turned up or down. Describe the two regulatory mechanisms the lecturer covers, and how they respond to high and low energy states in the cell.", "a": "Allosteric regulation acts on E1. When the cell has high energy, ATP, NADH, and acetyl-CoA bind allosteric sites and decrease activity. When the cell has low energy, AMP, NAD+, and free CoA bind and increase activity. Phosphorylation regulation uses PDH kinase, which is permanently bound and phosphorylates E1 to decrease activity. The kinase is activated by ATP. A permanently bound phosphatase removes the phosphate by hydrolysis and restores activity when the kinase is off."}]}, {"num": 9, "title": "The Citric Acid Cycle", "guide": "<h1 id=\"bimm-100-lecture-9-study-guide-the-citric-acid-cycle\">BIMM 100 Lecture 9 Study Guide: The Citric Acid Cycle</h1>\n<h2 id=\"purpose-and-overview\">Purpose and overview</h2>\n<p>The citric acid cycle is the next stage of cellular respiration. It completes the oxidation of the carbon atoms that came into the pathway from glucose to CO2. Acetyl-CoA from the PDH complex enters the cycle, where its two carbons are oxidized to two CO2 per turn. The cycle\u2019s main output is electrons captured in NADH and FADH2, along with one GTP (an ATP equivalent) per turn.</p>\n<h2 id=\"carbon-bookkeeping\">Carbon bookkeeping</h2>\n<p>Glucose has six carbons. Glycolysis splits them into two three-carbon pyruvates. The PDH complex releases one carbon per pyruvate as CO2 (2 CO2 per glucose). The remaining two-carbon acetyl groups enter the cycle. Each turn takes in two carbons from acetyl-CoA and releases two CO2, and each glucose supplies two acetyl-CoA, so the cycle releases four CO2 per glucose. Together, the six glucose carbons are all oxidized to CO2 (2 from the PDH complex, 4 from the cycle).</p>\n<p>The carbons that enter from acetyl-CoA are not the same carbons that leave as CO2 in that turn. The lecturer says the acetyl carbons can be tracked for the first part of the cycle, but after succinate the molecule is symmetrical, so tracking is lost. Carbons that remain on succinate are eventually released in later turns.</p>\n<h2 id=\"output-per-turn\">Output per turn</h2>\n<p>Per turn of the cycle the lecturer counts 3 NADH, 1 FADH2, 1 GTP (ATP equivalent), and 2 CO2. Per glucose, the cycle runs twice.</p>\n<h2 id=\"the-eight-steps\">The eight steps</h2>\n<p>You need the name of each enzyme and intermediate, what happens in each step, and carbon counts. For the alpha-ketoglutarate through succinate steps, the lecturer expects you to know structures too.</p>\n<ol type=\"1\">\n<li><strong>Citrate synthase.</strong> Acetyl-CoA (2 carbons) plus oxaloacetate (4 carbons) forms citrate (6 carbons). CoA is released. The energy comes from breaking the thioester bond. The lecturer classifies citrate synthase as a ligase and distinguishes \u201csynthases\u201d (energy from a non-ATP source, here the thioester) from \u201csynthetases\u201d (energy directly from ATP).</li>\n<li><strong>Isomerization (aconitase; the transcript says \u201ciconitase\u201d).</strong> Citrate becomes isocitrate by moving one hydroxyl group from one carbon to the adjacent carbon. This happens through an enzyme-bound intermediate, via removal and return of water. The lecturer says it is enough to know it is an isomerization.</li>\n<li><strong>Isocitrate dehydrogenase.</strong> Oxidative decarboxylation. One carbon leaves as CO2, a hydride is transferred to NAD+ (producing NADH), and alpha-ketoglutarate (5 carbons) forms. This step is irreversible.</li>\n<li><strong>Alpha-ketoglutarate dehydrogenase complex.</strong> A second oxidative decarboxylation. CO2 leaves, NADH is formed, and succinyl-CoA (4 carbons) is produced with CoA attached. This step is irreversible. The complex is an alpha-ketoacid dehydrogenase with three enzyme activities, mechanistically identical to the PDH complex (Lecture 8), with a lipoyl arm that carries intermediates.</li>\n<li><strong>Succinyl-CoA synthetase.</strong> Succinyl-CoA is converted to succinate. CoA is released, and free phosphate is added to form a high-energy succinyl phosphate intermediate. The phosphate is then transferred to GDP to form GTP. This is a substrate-level phosphorylation. The reaction is reversible, though the lecturer says it primarily runs forward physiologically. Nucleoside diphosphate kinase interconverts GTP plus ADP and GDP plus ATP with essentially no energy change, so the cell can use GTP or ATP as needed.</li>\n<li><strong>Succinate dehydrogenase.</strong> Succinate is oxidized to fumarate, and the electrons are transferred to FAD, forming FADH2. This is the only membrane-bound enzyme of the cycle (an integral protein of the inner mitochondrial membrane) and the only one that uses FAD rather than NAD+. The FADH2 stays bound to the enzyme, and its electrons pass into the electron transport chain (Lecture 10).</li>\n<li><strong>Fumarase.</strong> A hydration reaction: water is added across the double bond of fumarate to give malate. This is a reversible lyase-class reaction. It places a hydroxyl group on a carbon that is a good target for the next dehydrogenation.</li>\n<li><strong>Malate dehydrogenase.</strong> Malate is oxidized to oxaloacetate, transferring a hydride to NAD+ to form NADH. This regenerates the starting molecule. The lecturer notes this reaction is reversible, which will matter later.</li>\n</ol>\n<h2 id=\"irreversible-steps\">Irreversible steps</h2>\n<p>The lecturer emphasizes three irreversible steps: citrate formation (citrate synthase), isocitrate to alpha-ketoglutarate (isocitrate dehydrogenase), and alpha-ketoglutarate to succinyl-CoA (alpha-ketoglutarate dehydrogenase complex).</p>\n<h2 id=\"the-principle-behind-substrate-level-phosphorylation\">The principle behind substrate-level phosphorylation</h2>\n<p>The lecturer\u2019s key point is that the GTP-forming step parallels the substrate-level phosphorylation in glycolysis (steps 6 and 7 with glyceraldehyde-3-phosphate dehydrogenase). Whenever free phosphate is brought in from solution to form a high-energy intermediate (here, an acyl phosphate), that event is linked to an oxidation step. In the citric acid cycle, the oxidation (alpha-ketoglutarate to succinyl-CoA) yields a high-energy thioester, which is broken to drive phosphate addition, and the phosphate is then transferred to GDP.</p>\n<h2 id=\"the-cycle-as-a-metabolic-hub\">The cycle as a metabolic hub</h2>\n<p>The lecturer stresses that the citric acid cycle is a central hub of metabolism, with intermediates siphoned out for biosynthesis and others entering from breakdown pathways.</p>\n<ul>\n<li><strong>Citrate</strong> moves acetyl groups from the matrix to the cytoplasm for fatty acid and sterol synthesis. (Acetyl-CoA plus oxaloacetate forms citrate, which is exported.)</li>\n<li><strong>Alpha-ketoglutarate</strong> and glutamate are interconverted by transfer of an amino group from another substrate, which connects the cycle to amino acid metabolism. From glutamate, other amino acids and purine nucleotides can be made.</li>\n<li><strong>Succinyl-CoA</strong> is an intermediate for other biosynthetic pathways.</li>\n<li><strong>Oxaloacetate and aspartate</strong> are interconverted in a single enzyme-catalyzed step, also by amino group transfer. Aspartate and asparagine can give rise to other amino acids.</li>\n<li><strong>Malate and oxaloacetate</strong> interconversion participates in a shuttle that moves electron pairs across the mitochondrial membrane.</li>\n<li><strong>Oxaloacetate</strong> is the first intermediate of gluconeogenesis (glucose synthesis from pyruvate). It is also the intermediate that carries carbon from pyruvate across the irreversible step that converts pyruvate to phosphoenolpyruvate.</li>\n</ul>\n<p>The lecturer says that for the exam, you need to be able to draw the alpha-ketoglutarate to glutamate and oxaloacetate to aspartate interconversions, but not the full hub diagram.</p>\n<h2 id=\"key-facts-to-remember\">Key facts to remember</h2>\n<ul>\n<li>Each turn: 2 carbons in, 2 CO2 out, 3 NADH, 1 FADH2, 1 GTP.</li>\n<li>Per glucose: 2 turns, 4 CO2 from the cycle, plus 2 CO2 from the PDH complex.</li>\n<li>Reactions with NADH: isocitrate dehydrogenase, alpha-ketoglutarate dehydrogenase complex, malate dehydrogenase. FADH2: succinate dehydrogenase.</li>\n<li>Substrate-level phosphorylation: succinyl-CoA synthetase makes GTP.</li>\n<li>Succinate dehydrogenase is the only membrane-bound enzyme in the cycle and the only one using FAD.</li>\n<li>The cycle is also a hub: citrate (lipid synthesis), alpha-ketoglutarate and oxaloacetate (amino acid links), and oxaloacetate (gluconeogenesis).</li>\n</ul>\n", "mc": [{"n": 1, "q": "How many NADH, FADH2, and GTP are produced in one turn of the citric acid cycle, according to the lecturer?", "opts": ["2 NADH, 1 FADH2, 1 GTP", "3 NADH, 1 FADH2, 1 GTP", "3 NADH, 2 FADH2, 1 GTP", "1 NADH, 3 FADH2, 1 GTP"], "ans": "B", "why": "Per turn: 3 NADH, 1 FADH2, and 1 GTP (an ATP equivalent)."}, {"n": 2, "q": "Which molecule combines with acetyl-CoA in the first step of the citric acid cycle to form citrate?", "opts": ["Succinate", "Alpha-ketoglutarate", "Oxaloacetate", "Fumarate"], "ans": "C", "why": "Acetyl-CoA plus oxaloacetate forms citrate, catalyzed by citrate synthase."}, {"n": 3, "q": "Which enzyme catalyzes the first oxidative decarboxylation in the cycle, forming alpha-ketoglutarate?", "opts": ["Citrate synthase", "Isocitrate dehydrogenase", "Succinate dehydrogenase", "Malate dehydrogenase"], "ans": "B", "why": "Isocitrate dehydrogenase removes one carbon as CO2 and transfers a hydride to NAD+, forming alpha-ketoglutarate."}, {"n": 4, "q": "How many carbons are in succinyl-CoA?", "opts": ["3", "4", "5", "6"], "ans": "B", "why": "Succinyl-CoA has four carbons (it follows alpha-ketoglutarate, which has five, after loss of one CO2)."}, {"n": 5, "q": "Which step is the substrate-level phosphorylation of the citric acid cycle?", "opts": ["Citrate to isocitrate", "Succinyl-CoA to succinate", "Fumarate to malate", "Malate to oxaloacetate"], "ans": "B", "why": "Succinyl-CoA synthetase transfers a phosphate to GDP to form GTP, a substrate-level phosphorylation."}, {"n": 6, "q": "Which enzyme of the citric acid cycle is membrane-bound and uses FAD rather than NAD+?", "opts": ["Citrate synthase", "Aconitase", "Succinate dehydrogenase", "Fumarase"], "ans": "C", "why": "Succinate dehydrogenase is the only membrane-bound enzyme of the cycle and the only one that uses FAD."}, {"n": 7, "q": "Which reaction in the cycle is a hydration (addition of water across a double bond)?", "opts": ["Fumarate to malate, catalyzed by fumarase", "Succinate to fumarate, catalyzed by succinate dehydrogenase", "Isocitrate to alpha-ketoglutarate", "Oxaloacetate to citrate"], "ans": "A", "why": "Fumarase adds water across the double bond of fumarate to form malate."}, {"n": 8, "q": "According to the lecturer, which step is NOT one of the irreversible steps of the cycle?", "opts": ["Citrate formation", "Isocitrate to alpha-ketoglutarate", "Alpha-ketoglutarate to succinyl-CoA", "Malate to oxaloacetate"], "ans": "D", "why": "The lecturer lists citrate formation, isocitrate to alpha-ketoglutarate, and alpha-ketoglutarate to succinyl-CoA as irreversible. Malate to oxaloacetate is reversible, as the lecturer notes."}, {"n": 9, "q": "Which intermediate can be exported from the mitochondrial matrix to the cytoplasm to support fatty acid and sterol synthesis?", "opts": ["Citrate", "Succinyl-CoA", "Fumarate", "Malate"], "ans": "A", "why": "Citrate formed in the matrix can be exported to the cytoplasm, where it supports fatty acid and sterol synthesis."}, {"n": 10, "q": "Which amino acid is the amino form of oxaloacetate in the interconversion the lecturer describes?", "opts": ["Glutamate", "Aspartate", "Glycine", "Serine"], "ans": "B", "why": "Aspartate is the amino acid form of oxaloacetate, interconverted by amino group transfer in a single enzyme-catalyzed step."}], "sa": [{"n": 11, "q": "Explain the carbon bookkeeping for one turn of the citric acid cycle, and for a whole glucose molecule. Where does the CO2 come from in each case?", "a": "Each turn takes in two carbons from acetyl-CoA and releases two CO2. In a single turn, two CO2 are released by the two oxidative decarboxylations, isocitrate dehydrogenase and the alpha-ketoglutarate dehydrogenase complex, each releasing one CO2. The lecturer notes these are not necessarily the acetyl carbons that just entered, but the count balances: two carbons in, two CO2 out. For a whole glucose, glycolysis makes two three-carbon pyruvates. The PDH complex releases 2 CO2 (one per pyruvate). The two acetyl-CoA then go through two turns, releasing 4 CO2. Together, the six glucose carbons are fully oxidized to 6 CO2."}, {"n": 12, "q": "Explain how the energy for the succinyl-CoA to succinate step is generated. Trace the chain of steps from the oxidation that precedes it to GTP formation.", "a": "Alpha-ketoglutarate is oxidatively decarboxylated to succinyl-CoA, which is a high-energy thioester. Breaking this thioester releases energy that drives the addition of free phosphate from solution, forming a high-energy succinyl phosphate intermediate. The phosphate is then transferred to GDP to form GTP. Because the phosphate is brought in from solution, the step is tied to the earlier oxidation, which is the original energy source. This mirrors the substrate-level phosphorylation in glycolysis."}, {"n": 13, "q": "The lecturer calls the citric acid cycle a \"central hub of metabolism.\" Give two examples of intermediates that connect the cycle to other pathways, and describe each connection.", "a": "Any two of these are acceptable. (a) Citrate can be exported from the matrix to the cytoplasm, where it supplies acetyl groups for fatty acid and sterol synthesis. (b) Alpha-ketoglutarate interconverts with glutamate by amino group transfer, linking the cycle to amino acid metabolism and, from glutamate, to other amino acids and purine nucleotides. (c) Oxaloacetate interconverts with aspartate, and oxaloacetate is the first intermediate of gluconeogenesis. (d) Succinyl-CoA is an intermediate for other biosynthetic pathways."}]}, {"num": 10, "title": "The Mitochondrial Electron Transport Chain, Part A", "guide": "<h1 id=\"bimm-100-lecture-10-study-guide-the-mitochondrial-electron-transport-chain-part-a\">BIMM 100 Lecture 10 Study Guide: The Mitochondrial Electron Transport Chain, Part A</h1>\n<p>This guide covers Part A of the electron transport chain (ETC) lecture, which covers the overall logic, electron carriers, reduction potentials, and complexes I through III. Complex IV, the oxygen reduction step, and ATP synthesis are in Part B, which is not covered here.</p>\n<h2 id=\"overview-and-purpose\">Overview and purpose</h2>\n<p>NADH made in glycolysis, the PDH complex, and the citric acid cycle (most of it comes from the cycle) delivers electrons to the ETC, which is a series of protein complexes embedded in the inner mitochondrial membrane. Electrons flow through the complexes in an exergonic (downhill) series of transfers, and the energy released is used to pump protons from the matrix into the IMS. The resulting proton gradient is a store of potential energy, a proton motive force with both a chemical component (a concentration gradient) and an electrical component (a membrane potential). This gradient later drives ATP formation (Part B). Oxygen is the final electron acceptor, reduced to water.</p>\n<p>The lecturer notes that the ETC is also the source of the water produced when glucose is fully oxidized.</p>\n<h2 id=\"spatial-orientation\">Spatial orientation</h2>\n<p>Keep track of where things are. The matrix is inside the inner membrane, the IMS is between the two membranes, and the cytoplasm is outside the outer membrane. The ETC spans the inner membrane. Protons are pumped from the matrix into the IMS. Ubiquinone is soluble in the membrane, and cytochrome c is soluble in the IMS.</p>\n<h2 id=\"electron-carriers\">Electron carriers</h2>\n<p>The lecturer does not require the location of carriers within each complex or their order, but you should know the general type of each carrier and how many electrons it carries.</p>\n<ul>\n<li><strong>FAD and FMN</strong> carry two electrons (picked up as two hydrogens). They act as funnels: they accept electron pairs and pass them on one electron at a time. FMN is the business end of FAD, and FAD can exist as a semiquinone free radical.</li>\n<li><strong>Heme groups</strong> carry one electron at a time. The iron in the center of the heme shuttles between Fe3+ and Fe2+. Proteins with heme are cytochromes. Heme types (a, b, c) differ in their side groups. Reduced and oxidized forms absorb light differently, which helped scientists trace electron flow. You do not need to draw heme.</li>\n<li><strong>Iron-sulfur centers</strong> carry one electron at a time. They can contain one or more irons coordinated by sulfur atoms, and proteins containing them are iron-sulfur proteins.</li>\n<li><strong>Ubiquinone (coenzyme Q, Q)</strong> is the most central carrier because it moves electrons between complexes. It has a polar ring and a long nonpolar tail, so it stays in the inner membrane. Q is reduced to ubiquinol (QH2) by picking up two electrons and two protons. The membrane contains a large pool of both Q and QH2. Q can exist transiently as a semiquinone radical.</li>\n</ul>\n<p>Rule of thumb: the carriers that move one electron at a time are heme and iron-sulfur centers (and cytochrome c). FAD, FMN, and ubiquinone handle electron pairs, and the lecturer tracks \u201celectron pairs\u201d through the chain.</p>\n<h2 id=\"electron-flow-and-reduction-potential\">Electron flow and reduction potential</h2>\n<p>Electrons flow from a carrier with lower reduction potential to one with higher reduction potential. Reduction potential measures the pull on electrons, and the standard reduction potential at biochemical standard conditions is E\u00b0\u2019. The change in reduction potential is:</p>\n<p>\u0394E\u00b0\u2019 = E\u00b0\u2018(electron acceptor) - E\u00b0\u2019(electron donor)</p>\n<p>A positive \u0394E\u00b0\u2019 means the reaction is exergonic. The standard free energy change is:</p>\n<p>\u0394G\u00b0\u2019 = -n F \u0394E\u00b0\u2019</p>\n<p>where n is the number of electrons transferred and F is the Faraday constant, 96.48 kJ per volt-mole. For example, a pair of electrons (n = 2) moving through a \u0394E\u00b0\u2019 of 0.5 V releases 2 \u00d7 96.48 \u00d7 0.5 = 96.48 kJ/mol.</p>\n<p>Reduction potentials are measured against the standard hydrogen electrode, which has 1 M H+ and 1 atm H2. The voltmeter reading is the reduction potential. The lecturer gives NAD+/NADH as roughly -0.3 V, and notes that carriers in the ETC generally become more positive (higher reduction potential) as electrons move along the chain. Oxygen has a very high reduction potential, reflecting its electronegativity, so it is the final electron acceptor.</p>\n<h2 id=\"complex-i-nadh-dehydrogenase\">Complex I: NADH dehydrogenase</h2>\n<ul>\n<li>Roughly 42 polypeptide chains and about 850 kDa (the lecturer treats these numbers as background, not exam content).</li>\n<li>Entry point for electrons from NADH. NADH is oxidized to NAD+ (a hydride is removed).</li>\n<li>Electrons pass into an FMN, then through iron-sulfur centers one at a time, to a ubiquinone binding site at the membrane interface, where Q is reduced to QH2.</li>\n<li>Each pair of electrons passed from NADH to Q pumps 4 protons from the matrix into the IMS.</li>\n<li>Proton pumping mechanism (as described): Q binding and QH2 release shift a part of the complex. That shift is transmitted down a lateral arm to four proton-pumping subunits, each of which moves one proton. The lecturer says this mechanism is thought to work this way.</li>\n<li>Protons used to make QH2 come from the matrix side.</li>\n</ul>\n<h2 id=\"complex-ii-succinate-dehydrogenase\">Complex II: succinate dehydrogenase</h2>\n<ul>\n<li>Four subunits, about 140 kDa. Smaller, and it does not span the membrane fully.</li>\n<li>Oxidizes succinate to fumarate and transfers electrons from succinate, through FAD and three iron-sulfur centers, to Q, reducing it to QH2.</li>\n<li>It does not pump any protons.</li>\n<li>It is the same enzyme as succinate dehydrogenase of the citric acid cycle (Lecture 9). The FADH2 from the cycle step passes its electrons into this complex.</li>\n<li>Subunit D contains a single heme group that does not participate in the electron path. The lecturer\u2019s proposed role for it is as an emergency catch for superoxide radicals formed at the complex (superoxide binds the heme and is neutralized). The lecturer says this is a model, not established fact.</li>\n<li>The lecturer notes a mutation in the gene encoding subunit D, changing an amino acid near the heme, is associated with a higher cancer risk. The proposed explanation is that the mutation impairs the heme\u2019s ability to neutralize reactive oxygen species, which can then cause DNA damage.</li>\n</ul>\n<h2 id=\"reactive-oxygen-species-ros\">Reactive oxygen species (ROS)</h2>\n<p>The ETC has a downside. Electrons moving rapidly through iron-sulfur centers in an environment containing oxygen occasionally react with molecular oxygen at the wrong place, forming reactive oxygen species such as superoxide. ROS can oxidize and damage proteins, and if they escape the mitochondrion they can damage nuclear DNA. Cells have systems to neutralize ROS. The lecturer\u2019s view is that the huge ATP yield from complete glucose oxidation is worth the cost, and it made large, mobile multicellular animals possible.</p>\n<h2 id=\"complex-iii-ubiquinone-cytochrome-c-oxidoreductase\">Complex III: ubiquinone-cytochrome c oxidoreductase</h2>\n<ul>\n<li>About 22 polypeptide chains and about 500 kDa. Contains heme groups and iron-sulfur centers.</li>\n<li>Oxidizes QH2 back to Q and transfers electrons, one at a time, to two molecules of cytochrome c.</li>\n<li>Cytochrome c is a small (about 30 to 40 kDa, per the lecturer) soluble protein with one heme. It is free in the IMS, with one binding site on complex III. It carries one electron at a time from complex III to complex IV.</li>\n<li>The lecturer states that each pair of electrons passing through complex III pumps four protons across the membrane. A later passage in the same lecture also says one pair of electrons provides energy to pump eight protons in total, which appears to conflict with the four-proton figure. Confirm this against the course slides before relying on either number.</li>\n</ul>\n<p><strong>The Q cycle</strong> explains how complex III splits a pair of electrons from QH2 into two separate cytochrome c molecules and pumps protons. The lecturer says the Q cycle is required knowledge at the conceptual level:</p>\n<ol type=\"1\">\n<li><strong>First QH2.</strong> QH2 binds to the primary binding site and releases its two protons into the IMS. One electron goes through iron-sulfur centers and a heme to a cytochrome c.\u00a0The other electron goes to a Q bound at the matrix-side site, forming a semiquinone radical that stays bound.</li>\n<li><strong>Second QH2.</strong> A second QH2 binds and releases two more protons into the IMS (four protons total). One electron goes to a second cytochrome c.\u00a0The other electron reduces the waiting semiquinone to QH2, which takes up two protons from the matrix.</li>\n<li><strong>Net result.</strong> Two QH2 are consumed and one QH2 is regenerated, for a net consumption of one QH2. Two cytochrome c are reduced, and four protons are released into the IMS.</li>\n</ol>\n<p>The lecturer says the proton pumping mechanism of complex I is less established than that of complex III.</p>\n<h2 id=\"key-facts-to-remember\">Key facts to remember</h2>\n<ul>\n<li>The ETC runs from NADH (and FADH2) to oxygen, using inner membrane complexes and carriers, with electrons flowing toward higher reduction potential.</li>\n<li>\u0394G\u00b0\u2019 = -nF\u0394E\u00b0\u2019, with F = 96.48 kJ/(V\u00b7mol).</li>\n<li>Complex I: NADH to Q, 4 H+ per electron pair.</li>\n<li>Complex II: succinate to Q, no protons pumped; it is also the citric acid cycle\u2019s succinate dehydrogenase.</li>\n<li>Complex III: QH2 to two cytochrome c, with the Q cycle.</li>\n<li>Cytochrome c is soluble in the IMS and carries one electron at a time.</li>\n<li>ROS are produced as a by-product of electron transfer; subunit D\u2019s heme is hypothesized to neutralize superoxide.</li>\n</ul>\n", "mc": [{"n": 1, "q": "Which complex is the entry point for electrons from NADH into the electron transport chain?", "opts": ["Complex I", "Complex II", "Complex III", "Cytochrome c"], "ans": "A", "why": "Complex I (NADH dehydrogenase) receives electrons from NADH."}, {"n": 2, "q": "Which electron carrier is soluble in the intermembrane space and carries one electron at a time from complex III onward?", "opts": ["Ubiquinone", "FMN", "Cytochrome c", "Succinate"], "ans": "C", "why": "Cytochrome c is a small soluble protein in the IMS with one heme that carries one electron at a time from complex III to complex IV."}, {"n": 3, "q": "Which electron carrier can accept two electrons and funnel them into carriers that handle one electron at a time?", "opts": ["Heme", "Iron-sulfur center", "FAD or FMN", "Cytochrome c"], "ans": "C", "why": "FAD and FMN accept a pair of electrons and donate them one at a time, acting as a funnel for carriers that take one electron at a time."}, {"n": 4, "q": "Which statement about ubiquinone (Q) is correct, according to the lecturer?", "opts": ["It is soluble in the matrix and carries electrons inside a single complex.", "It is reduced to QH2 by picking up two electrons and two protons, and it shuttles electrons between complexes.", "It carries only one electron at a time and is embedded in cytochrome c.", "It is the final electron acceptor of the chain."], "ans": "B", "why": "Ubiquinone picks up two electrons and two protons to become QH2 (ubiquinol). It is lipid soluble and shuttles electrons between complexes."}, {"n": 5, "q": "Electrons in the electron transport chain flow:", "opts": ["From carriers with higher reduction potential to carriers with lower reduction potential", "From carriers with lower reduction potential to carriers with higher reduction potential", "In a direction that does not depend on reduction potential", "Only from complex I to complex IV"], "ans": "B", "why": "Electrons flow toward carriers with greater reduction potential, which makes the process downhill."}, {"n": 6, "q": "If \u0394E\u00b0' for a reaction is positive, the standard free energy change (\u0394G\u00b0') is:", "opts": ["Positive, so the reaction is endergonic", "Negative, so the reaction is exergonic", "Zero, so the reaction is at equilibrium", "Undefined without a temperature"], "ans": "B", "why": "\u0394G\u00b0' = -nF\u0394E\u00b0'. A positive \u0394E\u00b0' gives a negative \u0394G\u00b0', which is exergonic."}, {"n": 7, "q": "A pair of electrons (n = 2) moves through a \u0394E\u00b0' of 0.5 V. Using \u0394G\u00b0' = -nF\u0394E\u00b0' with F = 96.48 kJ/(V\u00b7mol), what is \u0394G\u00b0'?", "opts": ["-48.2 kJ/mol", "-96.5 kJ/mol", "+96.5 kJ/mol", "-9.6 kJ/mol"], "ans": "B", "why": "\u0394G\u00b0' = -(2)(96.48)(0.5) = -96.48 kJ/mol, approximately -96.5 kJ/mol."}, {"n": 8, "q": "Complex II (succinate dehydrogenase) of the electron transport chain:", "opts": ["Pumps four protons per pair of electrons", "Oxidizes succinate to fumarate, transfers electrons to Q, and pumps no protons", "Oxidizes NADH to NAD+", "Transfers electrons from QH2 to cytochrome c"], "ans": "B", "why": "Complex II is succinate dehydrogenase. It does not pump protons. It is the same enzyme as in the citric acid cycle."}, {"n": 9, "q": "Per pair of electrons passing from NADH to Q, complex I pumps how many protons, according to the lecturer?", "opts": ["2", "4", "6", "8"], "ans": "B", "why": "The lecturer says complex I pumps four protons per pair of electrons passed from NADH to Q."}, {"n": 10, "q": "The lecturer proposes that the heme group in subunit D of complex II functions to:", "opts": ["Carry electrons from succinate to FAD", "Pump protons across the inner membrane", "Act as a catch for superoxide radicals, neutralizing reactive oxygen species", "Bind oxygen as the final electron acceptor"], "ans": "C", "why": "The lecturer describes the heme as a model for an emergency catch for superoxide radicals, which the lecturer says is a hypothesis rather than established fact."}], "sa": [{"n": 11, "q": "Explain how complex III splits a single pair of electrons from QH2 into two separate cytochrome c molecules, and describe what happens to the protons carried by QH2 during the process.", "a": "QH2 binds at the primary binding site and gives up its two electrons. The two electrons take different paths. One goes through iron-sulfur centers and a heme to a cytochrome c that is docked on the IMS side. The other goes to a Q bound on the matrix side, forming a semiquinone radical. A second QH2 then repeats the process: one electron goes to a second cytochrome c, and the other electron reduces the waiting semiquinone to QH2 (which picks up two protons from the matrix). The two protons carried by each QH2 are released to the IMS, so four protons are released into the IMS over the full cycle. Two cytochrome c are reduced in total, and the net effect is that one QH2 is consumed."}, {"n": 12, "q": "Describe what reactive oxygen species are, where they come from in the electron transport chain, and why the lecturer says cells need mechanisms to neutralize them.", "a": "Reactive oxygen species are damaging molecules, such as superoxide, formed when electrons leak out of the chain and react with molecular oxygen at the wrong place. Electrons moving rapidly through iron-sulfur centers in an oxygen-containing environment make this possible. ROS can oxidize and destroy proteins, and if they escape the mitochondrion they can damage DNA. Without mechanisms to neutralize them, the cell would be damaged by its own respiration, so cells have evolved systems to counteract them."}, {"n": 13, "q": "Explain why electron flow through the electron transport chain is described as exergonic. Use the concept of reduction potential in your answer.", "a": "Electrons flow from carriers with lower reduction potential to carriers with greater reduction potential. Reduction potential measures the pull on electrons, and the standard change in reduction potential (\u0394E\u00b0') is positive for these downhill transfers. Because \u0394G\u00b0' = -nF\u0394E\u00b0', a positive \u0394E\u00b0' gives a negative \u0394G\u00b0', so the transfers release free energy. The lecturer notes this energy is used to pump protons across the membrane."}]}, {"num": 11, "title": "Mitochondrial Electron Transport Chain, Part B", "guide": "<h1 id=\"lecture-11-study-guide-mitochondrial-electron-transport-chain-part-b\">Lecture 11 Study Guide: Mitochondrial Electron Transport Chain, Part B</h1>\n<p><em>Source: \u201cen-Lecture 11 - Mitochondrial Electron Transport Chain - Part B\u201d transcript. The transcript is auto-generated and contains misspellings. Where a term was clearly garbled, this guide uses the standard spelling (for example, \u201cantimycin A,\u201d \u201crotenone,\u201d \u201csuccinate dehydrogenase,\u201d \u201cmalate-aspartate\u201d).</em></p>\n<h2 id=\"where-the-lecture-picks-up\">Where the lecture picks up</h2>\n<p>Complex I accepts electrons from NADH. Complex II, which is succinate dehydrogenase from the citric acid cycle, accepts electrons from succinate through its FAD prosthetic group. Both complexes pass their electrons to ubiquinone (Q), which becomes QH2. Complex III takes electrons from QH2 and deposits them into cytochrome c, one electron at a time, so that one pair of electrons is split between two cytochrome c molecules. This lecture finishes the chain with complex IV and then covers the experiments that established the order of the complexes.</p>\n<h2 id=\"complex-iv-cytochrome-c-oxidase\">Complex IV (cytochrome c oxidase)</h2>\n<p>Complex IV is called cytochrome c oxidase. The lecturer describes it as somewhat smaller than complexes I and III, with 13 polypeptide chains and a mass of about 204 kilodaltons (the transcript says \u201ckilodons,\u201d which is a transcription error). It contains heme groups, iron-sulfur centers, and metal ion cofactors. Copper shuttles between Cu2+ and Cu+ to carry electrons.</p>\n<p>Complex IV takes electrons from two reduced cytochrome c molecules and returns them to the oxidized form. The lecturer explains the name by contrasting oxidases with dehydrogenases. Both are oxidoreductases, but an oxidase transfers electrons from an organic substrate to molecular oxygen, which is the electron acceptor. Oxygen is therefore the final electron acceptor of the chain, and complex IV hands electrons to it.</p>\n<p>Each pair of electrons reduces half an oxygen molecule to one water molecule. It takes two electron pairs to fully reduce one O2 to two H2O. Each reduction also consumes two protons from solution. The lecturer notes that the pumping mechanism at complex IV is \u201cnot entirely understood.\u201d It may resemble the Q cycle in some ways, but no Q is involved, and cytochrome c probably binds one molecule at a time.</p>\n<h2 id=\"proton-pumping-totals\">Proton pumping totals</h2>\n<p>Electron flow down the chain is exergonic, and that energy is used to pump protons across the inner mitochondrial membrane. The lecture gives these numbers:</p>\n<ul>\n<li>Complex I pumps 4 protons.</li>\n<li>Complex III pumps 4 protons.</li>\n<li>Complex IV pumps 2 protons.</li>\n</ul>\n<p>A pair of electrons that enters at complex I and passes all the way to oxygen therefore pumps 10 protons in total. The lecturer\u2019s arithmetic in the transcript is garbled (\u201c4 plus 4 plus 10, plus 2 is 10\u201d), but the component counts 4 + 4 + 2 = 10 are the ones that match the rest of the lecture.</p>\n<p>Complex II pumps no protons itself. A pair of electrons that enters at complex II from succinate passes through complexes III and IV, pumping 4 + 2 = 6 protons. The lecturer says this means succinate-derived electron pairs yield less energy for the gradient than NADH-derived pairs.</p>\n<p>The result is the proton gradient, which the lecturer compares to a battery storing potential energy. The next lecture will show how ATP synthase uses it.</p>\n<h2 id=\"electron-flow-is-required-for-pumping\">Electron flow is required for pumping</h2>\n<p>Protons are pumped only while electrons are moving. If electrons sit in a complex and do not leave, no pumping occurs. The lecturer uses a water wheel analogy: electron flow is like water turning a wheel, and a stationary wheel does nothing. When an inhibitor blocks flow, pumping stops. The lecturer corrected an earlier slide to remove the protons shown as pumped in the presence of an inhibitor.</p>\n<p>The water produced by complex IV is the final fate of the electrons removed from glucose. Carbon dioxide comes from the PDH complex and the citric acid cycle. Water comes from complex IV.</p>\n<h2 id=\"the-experimental-system-isolated-mitochondria\">The experimental system: isolated mitochondria</h2>\n<p>Biochemists figured out the order of the complexes in experiments from the 1950s through the early 1980s. The lecture\u2019s approach uses isolated mitochondria:</p>\n<ul>\n<li>Tissue, such as beef liver, is homogenized and the organelles are purified mainly by centrifugation, including density gradient centrifugation.</li>\n<li>Isolated mitochondria keep their outer and inner membranes intact, along with the transporters that move small molecules across.</li>\n<li>Anything in the matrix when the mitochondria are isolated is used up quickly. The investigator therefore controls the matrix contents by adding substances to the surrounding buffer, and they are imported into the matrix.</li>\n<li>Oxidizable substrates are NADH and succinate. They can be added alone, together, or not at all.</li>\n</ul>\n<p>To track electron flow, the investigator measures the oxidation state of each electron carrier (heme, iron-sulfur centers, FMN). Each carrier has an absorption spectrum that shifts slightly between its oxidized and reduced forms. Careful spectrophotometry therefore shows which complexes are carrying electrons. For cytochrome c, the heme group is what changes color.</p>\n<h2 id=\"inhibitors-and-what-they-block\">Inhibitors and what they block</h2>\n<p>Inhibitors block electron flow at specific points. Knowing exactly where each one acts is the key to reading the experiments:</p>\n<ul>\n<li><strong>Rotenone</strong> blocks electrons moving from complex I into Q. Complex I still fills with electrons from NADH, but cannot reduce Q to QH2.</li>\n<li><strong>Antimycin A</strong> blocks electrons moving from QH2 into complex III. Complex I fills, and Q is converted to QH2, but QH2 cannot be oxidized back to Q at complex III.</li>\n<li><strong>Cyanide</strong> blocks the transfer of electrons from complex IV to oxygen. Complex IV fills, but cannot reduce oxygen.</li>\n</ul>\n<p>Worked example from the lecture: NADH is added with antimycin A, and no succinate is present. Electrons enter at complex I, which reduces Q to QH2 until almost all of the Q pool is QH2. Electrons already past the block drain through complex IV to oxygen. Complex I stays stuck in its reduced state, and the lecturer asks the student to predict the state of complex II. The answer is oxidized, because no succinate is supplying it.</p>\n<h2 id=\"water-jug-analogy\">Water jug analogy</h2>\n<p>The lecturer uses a set of interconnected jugs, drawn in a Dr.\u00a0Seuss style. Water represents electrons. NADH pours water into the complex I jug, and succinate (through FADH2) pours water into the complex II jug. A jug with water is reduced, and an empty jug is oxidized. An inhibitor is a closed valve. Water already past the valve drains out, and the jugs upstream stay full.</p>\n<h2 id=\"key-takeaways\">Key takeaways</h2>\n<ul>\n<li>Oxidase means O2 is the electron acceptor. Complex IV reduces O2 to water.</li>\n<li>A pair of electrons from NADH pumps 10 protons. A pair from succinate pumps 6.</li>\n<li>Proton pumping requires continuous electron flow.</li>\n<li>To identify an inhibited step, ask which carrier is the last one before the block. Everything upstream fills with electrons, and everything downstream drains.</li>\n</ul>\n", "mc": [{"n": 1, "q": "Complex IV of the electron transport chain is called:", "opts": ["Cytochrome c reductase", "Cytochrome c oxidase", "Succinate dehydrogenase", "ATP synthase"], "ans": "B", "why": "Complex IV is cytochrome c oxidase."}, {"n": 2, "q": "What is the final electron acceptor at the end of the electron transport chain?", "opts": ["Cytochrome c", "Ubiquinone (Q)", "Molecular oxygen", "NAD+"], "ans": "C", "why": "Molecular oxygen is the final electron acceptor. Complex IV transfers electrons to it."}, {"n": 3, "q": "How many protons are pumped across the inner mitochondrial membrane for one pair of electrons that enters at complex I and passes through to oxygen?", "opts": ["4", "6", "8", "10"], "ans": "D", "why": "Complex I pumps 4, complex III pumps 4, and complex IV pumps 2, for a total of 10."}, {"n": 4, "q": "How many protons are pumped for one pair of electrons that enters at complex II from succinate and passes through to oxygen?", "opts": ["2", "4", "6", "10"], "ans": "C", "why": "Complex II pumps no protons itself. Electrons from succinate pass through complexes III (4 protons) and IV (2 protons), for a total of 6."}, {"n": 5, "q": "Which inhibitor blocks the movement of electrons from QH2 into complex III?", "opts": ["Rotenone", "Antimycin A", "Cyanide", "Oligomycin"], "ans": "B", "why": "Antimycin A blocks electrons moving from QH2 into complex III."}, {"n": 6, "q": "Rotenone specifically blocks electrons moving:", "opts": ["From complex I into Q", "From complex IV into oxygen", "From succinate into complex II", "From cytochrome c into complex IV"], "ans": "A", "why": "Rotenone blocks electrons moving out of complex I into Q."}, {"n": 7, "q": "Cyanide blocks electron movement:", "opts": ["From complex I into Q", "From QH2 into complex III", "From complex IV into oxygen", "From NADH into complex I"], "ans": "C", "why": "Cyanide blocks electrons moving from complex IV into oxygen."}, {"n": 8, "q": "Which measurement does the lecture use to determine whether an electron carrier is oxidized or reduced in isolated mitochondria?", "opts": ["Measuring the pH of the matrix", "Measuring the absorption spectrum of the carrier (spectrophotometry)", "Weighing the mitochondria before and after adding substrate", "Radioactive labeling of the substrate"], "ans": "B", "why": "Each electron carrier has an absorption spectrum that differs slightly between its oxidized and reduced states, so spectrophotometry reveals its redox state."}, {"n": 9, "q": "In the lecture's jug analogy, what does an empty jug represent?", "opts": ["A reduced complex", "An oxidized complex", "A proton pumped across the membrane", "An inhibitor bound to the complex"], "ans": "B", "why": "In the lecture's analogy, water represents electrons. A full jug is reduced and an empty jug is oxidized."}, {"n": 10, "q": "Why does the lecturer say that no protons are pumped when an inhibitor such as antimycin A is present?", "opts": ["The inhibitor causes protons to leak back across the membrane", "Proton pumping requires electrons to keep moving through the chain", "The inhibitor adds protons to the matrix", "Complex IV pumps protons backward when the chain is blocked"], "ans": "B", "why": "Protons are pumped only while electrons are continuously moving through the chain. If the chain is blocked, electrons stop moving and pumping stops."}], "sa": [{"n": 11, "q": "Explain the difference between an oxidase and a dehydrogenase as the lecture describes it, and explain what complex IV does in those terms.", "a": "Both oxidases and dehydrogenases are oxidoreductases. An oxidase transfers electrons from an organic substrate to molecular oxygen, which is its electron acceptor. The lecturer contrasts this with dehydrogenases, which the class has already studied extensively and which do not use molecular oxygen as the acceptor. Complex IV is cytochrome c oxidase, so it transfers electrons from reduced cytochrome c to molecular oxygen. Each electron pair reduces half an oxygen molecule to one water molecule, and two pairs make 2 H2O from one O2. The lecture notes that each reduction also consumes two protons from solution."}, {"n": 12, "q": "Trace a pair of electrons that enters at complex II from succinate. Name each carrier it passes through, and explain why this pair yields fewer protons than a pair entering at complex I.", "a": "The pair of electrons enters at complex II through the FAD prosthetic group of succinate dehydrogenase. It passes to ubiquinone (Q), forming QH2. QH2 carries the electrons to complex III, which deposits them into cytochrome c. Cytochrome c carries them to complex IV, which reduces oxygen to water. Complex II itself pumps no protons, so the pair pumps 4 protons at complex III and 2 at complex IV, for 6 total. A pair entering at complex I pumps 4 at complex I, in addition to the 4 and 2 at complexes III and IV, for 10 total. The complex II entry point bypasses complex I's pumping step, so less energy goes into the proton gradient."}, {"n": 13, "q": "Suppose NADH and antimycin A are added to isolated mitochondria, with no succinate present. Describe the redox state of complex I, the Q pool, complex II, and the complexes downstream of the block, and explain why.", "a": "Electrons from NADH flow into complex I, which fills with electrons and reduces Q to QH2. Because antimycin A blocks QH2 from entering complex III, most of the Q pool ends up in the reduced QH2 form, with little or no Q left. Complex I stays reduced because it cannot pass electrons on. Complex II stays oxidized because there is no succinate supplying it. Complex III and complex IV are downstream of the block. Electrons already past the block drain through complex IV to oxygen, so these complexes return to their oxidized state. Protons are not pumped while the chain is blocked."}]}, {"num": 12, "title": "Oxidative Phosphorylation and ATP Synthase", "guide": "<h1 id=\"lecture-12-study-guide-oxidative-phosphorylation-and-atp-synthase\">Lecture 12 Study Guide: Oxidative Phosphorylation and ATP Synthase</h1>\n<p><em>Source: \u201cen-Lecture 12 - Oxidative Phosphorylation and ATP Synthase\u201d transcript. The transcript is auto-generated and contains misspellings. This guide uses standard spellings for clearly garbled terms (for example, \u201cconformation,\u201d \u201csuccinate dehydrogenase,\u201d \u201cNADH\u201d). Some numbers in the transcript are stated as the lecturer gave them, and the lecturer notes that some vary by species.</em></p>\n<h2 id=\"overview\">Overview</h2>\n<p>The electron transport chain builds a proton gradient across the inner mitochondrial membrane, with high proton concentration (low pH) in the intermembrane space (IMS) and low proton concentration (high pH) in the matrix. ATP synthase is the enzyme that uses this gradient to make ATP. It catalyzes the addition of inorganic phosphate to ADP:</p>\n<p>ADP + Pi \u2192 ATP + H2O (standard free energy change of about +30.5 kJ/mol, so the reaction is endergonic on its own)</p>\n<p>The lecturer calls this oxidative phosphorylation, the mode by which most ATP is made in eukaryotic cells.</p>\n<h2 id=\"structure-of-atp-synthase\">Structure of ATP synthase</h2>\n<p>ATP synthase spans the inner mitochondrial membrane and has two main parts.</p>\n<p><strong>F0</strong> is the membrane-embedded proton channel. The \u201cO\u201d refers to oligomycin
