 sensitivity, which the lecturer mentions for later. F0 is made of several subunits: - Subunit A is a single polypeptide that helps form the cleft through which protons pass. - Two B subunits form an arm that sticks up and connects to F1. - Up to 10 C subunits, each a transmembrane alpha-helical polypeptide, form a ring that is the core of the channel. Each C subunit has a negatively charged aspartate or glutamate side chain (depending on species) that can accept a proton. The number of C subunits varies by species (the lecturer mentions 8 to 11), which affects the number of protons needed per ATP.</p>\n<p><strong>F1</strong> is the catalytic portion that sticks out into the matrix. It contains: - A ring of three alpha-beta subunit pairs. The active sites are on the three beta subunits, so there are three active sites. - A gamma subunit, a long rod-like polypeptide that passes up through the center of the alpha-beta ring. - Epsilon, which sits on top of the F0 ring. - Delta, which connects F1 to the F0 arm.</p>\n<p>The lecturer uses the older terms N-side for the matrix (more negative charge) and P-side for the IMS (more protons).</p>\n<h2 id=\"rotational-catalysis\">Rotational catalysis</h2>\n<p>ATP synthase is said to work by rotational catalysis. Protons passing through F0 cause part of the enzyme to spin:</p>\n<ul>\n<li>Spinning parts: the ring of C subunits, plus gamma and epsilon attached to it.</li>\n<li>Stationary parts: subunit A, the B subunits, delta, and the alpha-beta ring.</li>\n</ul>\n<p>Proton movement drives the spin. A proton enters the cleft between subunit A and the C ring from the IMS side and binds a C subunit\u2019s negatively charged side chain. When it is protonated, the side chain becomes neutral and can move into the hydrophobic part of the membrane. A positively charged lysine on subunit A pushes protons along through charge repulsion. The protonated C subunit then comes around 360 degrees and releases its proton into the matrix.</p>\n<p>Gamma does not turn smoothly. It moves in three discrete 120-degree shifts, and at each shift it contacts the three beta subunits differently.</p>\n<h2 id=\"protons-per-atp\">Protons per ATP</h2>\n<p>On average, three protons pass through F0 to drive one 120-degree shift of gamma. One full 360-degree rotation therefore takes about nine protons (only nine of the ten C subunits need to be protonated for a full turn in the lecturer\u2019s example). Each 120-degree shift releases one ATP.</p>\n<p>Two more protons per ATP are not accounted for by F0 alone. Phosphate must be brought into the matrix against its concentration gradient by a symporter that moves one proton together with each phosphate. This is secondary active transport, powered by the proton gradient. The total is therefore three protons through ATP synthase plus one through the phosphate symporter, or <strong>four protons per ATP</strong> synthesized.</p>\n<p>An ADP/ATP antiporter moves the newly made ATP out of the matrix and ADP in from the IMS, one for one. It does not use the proton gradient directly.</p>\n<h2 id=\"three-beta-conformations\">Three beta conformations</h2>\n<p>At any moment, each of the three beta subunits is in one of three conformations, and each shift of gamma moves every beta subunit to the next one:</p>\n<ol type=\"1\">\n<li><strong>Beta-ADP (open):</strong> ADP and phosphate bind to the active site.</li>\n<li><strong>Beta-ATP (tight):</strong> ATP forms here. The lecturer says the transition from beta-ADP to beta-ATP increases the binding affinity for ATP about 10 million times. This \u201csucks\u201d the newly formed ATP tightly onto the subunit.</li>\n<li><strong>Beta-empty:</strong> The next 120-degree shift forces the subunit into this state, which releases ATP. This step requires the energy of the proton gradient. ATP is strongly bound in the beta-ATP form, so energy is needed to push it out.</li>\n</ol>\n<p>Note that the chemical step (forming ATP) is driven by the binding-affinity change, and the release step is driven by proton flow.</p>\n<h2 id=\"experiments-that-show-coupling\">Experiments that show coupling</h2>\n<p>The lecture uses isolated mitochondria to show that ATP synthesis and proton flow through F0 are tightly coupled.</p>\n<ul>\n<li><strong>Oxidizable substrate only (NADH or succinate, no ADP or Pi):</strong> The electron transport chain runs and creates a proton gradient, but protons do not flow back through F0 because F1 cannot cycle through its conformations without ADP and Pi. The lecturer says ATP synthesis and proton flow back into the matrix are tightly coupled, in both directions.</li>\n<li><strong>Gentle detergent, F1 separated from F0:</strong> F1 becomes soluble and F0 stays in the membrane. Now protons flow through F0 even without ADP and Pi, because the channel is no longer coupled to F1. Adding ADP and Pi produces no ATP, because F1 is no longer attached to F0 to couple the proton flow to synthesis.</li>\n<li><strong>Purified F1 alone:</strong> Adding ADP and Pi produces no ATP, because the reaction is far too endergonic (+30.5 kJ/mol) without a coupled exergonic process. The lecturer asks what happens when ATP is added to purified F1, implying the reverse reaction. The transcript hints at an old-fashioned alternative name for ATP synthase, but does not state that name.</li>\n</ul>\n<h2 id=\"shuttles-for-cytoplasmic-nadh\">Shuttles for cytoplasmic NADH</h2>\n<p>NADH made in glycolysis is in the cytoplasm. The inner mitochondrial membrane is impermeable to NADH, so the reducing electrons are moved across by one of two shuttles. Each tissue uses one or the other:</p>\n<p><strong>Malate-aspartate shuttle.</strong> Used in metabolically active tissues such as liver, kidney, and heart. - In the cytoplasm, malate dehydrogenase converts oxaloacetate to malate, taking electrons from NADH. NAD+ is regenerated in the cytoplasm. - Malate enters the matrix through a transporter. In the matrix, malate dehydrogenase (from the citric acid cycle) converts malate back to oxaloacetate and makes NADH in the matrix. This NADH enters complex I, so the electrons yield 10 protons. - The lecturer says the amino-acid steps (transamination of oxaloacetate to aspartate, and glutamate/alpha-ketoglutarate exchange) are there to get oxaloacetate back into the cytoplasm. Students are told to focus on the malate step.</p>\n<p><strong>Glycerol-3-phosphate shuttle.</strong> Used in more specialized tissues such as skeletal muscle and brain. - A cytoplasmic glycerol-3-phosphate dehydrogenase converts DHAP to glycerol-3-phosphate, taking the electrons from NADH. NAD+ is regenerated. - Glycerol-3-phosphate diffuses to the IMS, where a membrane-bound mitochondrial isozyme of glycerol-3-phosphate dehydrogenase converts it back to DHAP. This enzyme passes the electrons to an FAD prosthetic group, making FADH2. - The electrons go to Q, forming QH2. This enzyme is not complex II, but it works the same way: it bypasses complex I. Electrons from this shuttle pump 6 protons total, the same as succinate.</p>\n<p>Note the difference in outcome: the malate-aspartate shuttle delivers electrons to complex I (10 protons), and the glycerol-3-phosphate shuttle delivers them at the level of Q (6 protons).</p>\n<h2 id=\"topics-deferred\">Topics deferred</h2>\n<p>The lecturer said the total ATP yield per NADH and per glucose would be worked out in in-person sessions. The recording does not include those calculations. The lecture also mentions that the proton gradient coupling experiments will be covered in discussion section.</p>\n<h2 id=\"key-takeaways\">Key takeaways</h2>\n<ul>\n<li>ATP synthase uses the proton gradient to drive the addition of Pi to ADP. Protons flowing through F0 turn the C-ring, and the gamma shafts cause the three beta subunits to cycle through three conformations.</li>\n<li>Three protons go through F0 per ATP, plus one through the phosphate symporter, for four protons per ATP.</li>\n<li>ATP synthesis and proton flow are tightly coupled. Separating F1 from F0 uncouples them.</li>\n<li>The malate-aspartate shuttle delivers NADH electrons to complex I. The glycerol-3-phosphate shuttle delivers them at Q, bypassing complex I.</li>\n</ul>\n", "mc": [{"n": 1, "q": "Which part of ATP synthase is the membrane-embedded proton channel?", "opts": ["F1", "F0", "The gamma subunit", "The alpha-beta ring"], "ans": "B", "why": "F0 is the membrane-embedded proton channel. F1 is the catalytic portion in the matrix."}, {"n": 2, "q": "In the lecture's terminology, the matrix side of the inner membrane is called:", "opts": ["The P-side", "The N-side", "The IMS", "The cytosol"], "ans": "B", "why": "The lecturer uses N-side for the matrix and P-side for the IMS."}, {"n": 3, "q": "How many active sites does F1 have for ATP synthesis?", "opts": ["One", "Two", "Three", "Ten"], "ans": "C", "why": "The three beta subunits each carry an active site."}, {"n": 4, "q": "On average, how many protons pass through F0 to drive one 120-degree shift of the gamma subunit?", "opts": ["One", "Three", "Four", "Nine"], "ans": "B", "why": "Three protons per 120-degree shift, which makes about nine per full rotation."}, {"n": 5, "q": "According to the lecture, how many protons from the gradient are needed to make one ATP, including the phosphate transport step?", "opts": ["3", "4", "9", "10"], "ans": "B", "why": "Three protons pass through ATP synthase, and one more is used by the phosphate symporter, for four in total."}, {"n": 6, "q": "How is inorganic phosphate brought into the matrix against its concentration gradient?", "opts": ["Through a uniporter with no energy input", "Through a symporter that moves one proton with each phosphate", "Through ATP synthase itself", "By simple diffusion through the membrane"], "ans": "B", "why": "A symporter moves one proton in with each phosphate. This is secondary active transport, driven by the proton gradient."}, {"n": 7, "q": "In the ADP/ATP transporter described in the lecture, what happens for each molecule of ATP that leaves the matrix?", "opts": ["Two ADP molecules enter from the IMS", "One ADP molecule enters from the IMS", "One proton leaves the matrix", "No ADP enters, because the exchange is one-way"], "ans": "B", "why": "The ADP/ATP transporter is an exchange: one ATP goes out for every one ADP that comes in from the IMS."}, {"n": 8, "q": "In the lecture's \"beta\" conformations, when is ATP actually formed?", "opts": ["In the beta-empty conformation", "In the shift from beta-ADP to beta-ATP", "In the shift from beta-ATP to beta-empty", "During the protonation of the C subunits"], "ans": "B", "why": "The transition from beta-ADP to beta-ATP increases the binding affinity for ATP sharply, and phosphate is added to ADP at this step."}, {"n": 9, "q": "An investigator uses a gentle detergent to separate F1 from F0 in isolated mitochondria, then adds ADP and Pi with an oxidizable substrate present. What does the lecture predict?", "opts": ["ATP is synthesized rapidly", "ATP is not synthesized, because F1 is no longer coupled to F0", "Protons stop flowing through F0 completely", "F1 synthesizes ATP alone at the same rate"], "ans": "B", "why": "Without F1 attached to F0, the proton flow cannot be coupled to the conformational changes that make ATP, so no ATP is synthesized."}, {"n": 10, "q": "Which statement about the malate-aspartate shuttle is correct, according to the lecture?", "opts": ["It is used mainly in skeletal muscle and brain", "It delivers electrons from cytoplasmic NADH into the matrix as NADH, which enters complex I", "It delivers electrons directly to Q, bypassing complex I", "It uses FAD to carry electrons across the membrane"], "ans": "B", "why": "The malate-aspartate shuttle regenerates NADH in the matrix, and that NADH enters complex I. The glycerol-3-phosphate shuttle is the one that bypasses complex I."}], "sa": [{"n": 11, "q": "Describe the three beta-subunit conformations (beta-ADP, beta-ATP, and beta-empty). Explain what drives ATP formation and what drives ATP release.", "a": "In beta-ADP, the active site is open and ADP and phosphate bind. In beta-ATP, the subunit is in a conformation with much higher affinity for ATP, which is where ATP is actually formed (the lecture says the affinity increases about 10 million times). In beta-empty, the subunit releases ATP. ATP formation is driven by the change in binding affinity as the subunit shifts into the beta-ATP form. ATP release is driven by the energy of the proton gradient, which forces the next 120-degree shift of gamma and pushes the tightly bound ATP out of the active site."}, {"n": 12, "q": "Explain why the lecture says ATP synthesis and proton flow through F0 are \"tightly coupled,\" using at least two of the isolated mitochondria experiments as evidence.", "a": "Two experiments are useful. In intact isolated mitochondria with an oxidizable substrate but no ADP or Pi, the proton gradient forms but protons do not flow back through F0, because F1 cannot cycle without ADP and Pi. Conversely, when F1 is separated from F0 with a gentle detergent, protons flow freely through F0 even without ADP and Pi, but adding ADP and Pi produces no ATP, because F1 is no longer attached. Either way, proton flow and ATP synthesis depend on each other."}, {"n": 13, "q": "Compare the malate-aspartate shuttle and the glycerol-3-phosphate shuttle. Identify the tissues where each is used, the entry point each uses in the electron transport chain, and the number of protons each pair of electrons ultimately pumps.", "a": "The malate-aspartate shuttle is used in metabolically active tissues such as liver, kidney, and heart. It uses malate dehydrogenase to move electrons across the membrane as malate, then regenerates NADH in the matrix. That NADH enters complex I, so the pair pumps 10 protons. The glycerol-3-phosphate shuttle is used in tissues such as skeletal muscle and brain. It uses glycerol-3-phosphate dehydrogenase to move electrons into the membrane as FADH2, which passes them to Q. This bypasses complex I, like complex II, so the pair pumps 6 protons."}]}, {"num": 13, "title": "Gluconeogenesis", "guide": "<h1 id=\"lecture-13-study-guide-gluconeogenesis\">Lecture 13 Study Guide: Gluconeogenesis</h1>\n<p><em>Source: \u201cen-Lecture 13 - Gluconeogenesis\u201d transcript. The transcript is auto-generated and contains misspellings. This guide uses standard spellings for clearly garbled terms (for example, \u201cCori cycle,\u201d \u201cphosphoenolpyruvate,\u201d \u201cphosphoglycerate kinase\u201d). The transcript appears complete; see the report accompanying this guide.</em></p>\n<h2 id=\"overview\">Overview</h2>\n<p>Gluconeogenesis means \u201csynthesis of new glucose.\u201d It is the first anabolic pathway the course covers, and it builds glucose from non-carbohydrate precursors, starting from pyruvate. Most animals, plants, and many microorganisms can do it. In mammals it happens mainly in the liver, with a smaller contribution from the kidney and small intestine.</p>\n<p>The lecturer frames the rest of the course as shifting from chemistry toward how pathways interconnect, and what determines which pathways are on at a given moment. The underlying thermodynamics and redox chemistry still apply.</p>\n<h2 id=\"why-the-liver-makes-glucose\">Why the liver makes glucose</h2>\n<p>Some tissues are \u201ccarbohydrate dependent.\u201d These include the brain and the rest of the nervous system, and red blood cells (erythrocytes). They need glucose from the blood and cannot use fatty acids or amino acids for energy (the lecturer mentions one exception to be covered later). Muscle also draws glucose during activity. During fasting, blood glucose falls, and the liver replenishes it by gluconeogenesis. The lecturer says the liver can make 50 grams or more of glucose a day during prolonged fasting, and mentions up to 100 grams in a single day.</p>\n<h2 id=\"hormonal-control\">Hormonal control</h2>\n<p>Blood glucose is sensed by alpha cells in the pancreas (part of the islets of Langerhans). When glucose drops, these cells secrete <strong>glucagon</strong>, a protein hormone. Glucagon binds cell-surface receptors on hepatocytes (liver cells). Signal transduction then triggers several responses, one of which is to stimulate gluconeogenesis. The liver releases the resulting glucose into the blood. The lecturer\u2019s emphasis is that glucagon turns on gluconeogenesis in the liver in response to falling blood glucose. Insulin also regulates the pathway, but the lecture focuses on glucagon.</p>\n<h2 id=\"gluconeogenesis-as-glycolysis-in-reverse\">Gluconeogenesis as glycolysis in reverse</h2>\n<p>Gluconeogenesis is the reverse of glycolysis, with one exception: glycolysis has three irreversible steps, and gluconeogenesis uses different enzymes at those points, called bypasses. All the other steps use the same enzymes as glycolysis, running in reverse. The lecturer says the student must know the intermediates and enzymes, but that most of them are the glycolysis ones run backward.</p>\n<p>The first step (pyruvate to oxaloacetate) occurs in the mitochondrial matrix. The rest of the pathway takes place in the cytoplasm.</p>\n<h3 id=\"bypass-1-pyruvate-to-phosphoenolpyruvate-pep\">Bypass 1: pyruvate to phosphoenolpyruvate (PEP)</h3>\n<p>This bypass goes around the irreversible glycolysis step from PEP to pyruvate (the transcript does not name the enzyme in that step), and it takes two steps:</p>\n<ol type=\"1\">\n<li><strong>Pyruvate carboxylase</strong> attaches CO2 (as bicarbonate, shown as CO2 in the lecture) to pyruvate, forming oxaloacetate. This uses ATP. The lecturer notes that oxaloacetate is a citric acid cycle intermediate.</li>\n<li><strong>PEP carboxykinase (PEPCK)</strong> removes the carboxyl group from oxaloacetate and transfers a phosphate from GTP, forming PEP. The CO2 is released. This uses GTP.</li>\n</ol>\n<p>The lecturer explains that adding CO2 \u201cenergizes\u201d the intermediate. The ATP energy is stored in the carboxylated intermediate, which lets the next step make PEP. Fixing CO2 from solution to build biomolecules directly is not energetically feasible, so the carboxylation is used only as a temporary energy carrier.</p>\n<h3 id=\"reversed-reversible-steps\">Reversed reversible steps</h3>\n<p>From PEP, the rest of the pathway runs in reverse through the glycolysis enzymes. The lecturer lists these: - Enolase (PEP to 2-phosphoglycerate), a lyase-type reaction that is reversible. - Phosphoglycerate mutase (2-phosphoglycerate to 3-phosphoglycerate). - Phosphoglycerate kinase, which in reverse uses one ATP to convert 3-phosphoglycerate to 1,3-bisphosphoglycerate. This is one of the two ATP costs (each required per glucose, since each glucose yields two 3-carbon units). - Glyceraldehyde-3-phosphate dehydrogenase, which in reverse uses NADH to add a hydride to 1,3-bisphosphoglycerate and release phosphate, giving glyceraldehyde-3-phosphate (G3P). The lecturer asks the student to consider where the energy comes from to reverse this exergonic step, and leaves the answer for the student to work out. The transcript does not state an explicit answer. - Triose phosphate isomerase converts DHAP and G3P in both directions. Aldolase then condenses one DHAP and one G3P into fructose 1,6-bisphosphate. The lecturer notes that aldolase has a standard free energy change of about +23 kJ/mol in glycolysis, but that cell conditions allow the reaction to run in either direction.</p>\n<h3 id=\"bypass-2-fructose-16-bisphosphate-to-fructose-6-phosphate\">Bypass 2: fructose 1,6-bisphosphate to fructose 6-phosphate</h3>\n<p>In glycolysis, phosphofructokinase adds a phosphate to fructose 6-phosphate (an irreversible step). Gluconeogenesis cannot put the phosphate back onto ADP, so it simply hydrolyzes it off using <strong>fructose 1,6-bisphosphatase</strong>. The lecturer describes phosphatases as hydrolases.</p>\n<h3 id=\"isomerization\">Isomerization</h3>\n<p>Phosphohexose isomerase converts fructose 6-phosphate to glucose 6-phosphate and back. This step is reversible.</p>\n<h3 id=\"bypass-3-glucose-6-phosphate-to-glucose\">Bypass 3: glucose 6-phosphate to glucose</h3>\n<p>Glucose 6-phosphate is converted to free glucose by <strong>glucose-6-phosphatase</strong>, a simple hydrolysis. The lecturer notes that most cells would never do this, because they want glucose kept phosphorylated and trapped inside. The liver does it because its job is to export glucose to the blood.</p>\n<h2 id=\"regulation-glycolysis-and-gluconeogenesis-are-reciprocal\">Regulation: glycolysis and gluconeogenesis are reciprocal</h2>\n<p>Both phosphofructokinase (glycolysis) and fructose 1,6-bisphosphatase (gluconeogenesis) are highly regulated allosteric enzymes. Insulin and glucagon both act on them in the liver. A single allosteric regulator turns on phosphofructokinase and turns off fructose 1,6-bisphosphatase. (The transcript does not name this regulator.) Glucagon causes breakdown of this regulator, so glycolysis turns off and gluconeogenesis turns on.</p>\n<p>The lecturer says it would be \u201cmetabolic chaos\u201d for both pathways to run together, because carbon would cycle in a futile loop and waste energy. Whenever one is on, the other is off.</p>\n<h2 id=\"energetic-cost\">Energetic cost</h2>\n<p>To make one glucose from two pyruvate, gluconeogenesis requires: - 4 ATP (2 at pyruvate carboxylase and 2 at phosphoglycerate kinase, per glucose) - 2 GTP (at PEP carboxykinase, per glucose) - 2 NADH (consumed at the glyceraldehyde-3-phosphate dehydrogenase step, per glucose)</p>\n<p>By comparison, glycolysis of one glucose nets 2 ATP and produces 2 NADH. The lecturer concludes that making glucose costs more energy than glycolysis returns, but the liver pays that cost to keep blood glucose available to the whole organism.</p>\n<h2 id=\"supplying-nadh-to-the-cytoplasm\">Supplying NADH to the cytoplasm</h2>\n<p>Gluconeogenesis needs NADH in the cytoplasm for the glyceraldehyde-3-phosphate dehydrogenase step. Cytoplasmic NADH is limited, and the inner mitochondrial membrane is impermeable to NADH. The first bypass can therefore run in one of two versions, depending on where the NADH comes from.</p>\n<p><strong>Version 1: export NADH from the matrix.</strong> Under typical conditions, the matrix has plenty of NADH from the PDH complex and the citric acid cycle. - Pyruvate enters the matrix and pyruvate carboxylase makes oxaloacetate. - Matrix malate dehydrogenase reduces oxaloacetate to malate, taking electrons from NADH. - Malate leaves the matrix through a transporter and is reoxidized to oxaloacetate in the cytoplasm, regenerating NADH there. This is the malate-aspartate shuttle run in reverse. - Cytoplasmic oxaloacetate is converted to PEP by cytoplasmic PEP carboxykinase, and PEP exits to continue gluconeogenesis.</p>\n<p><strong>Version 2: use lactate-derived NADH.</strong> This version applies during heavy muscular exercise, when anaerobic glycolysis produces lactate. - Muscle makes lactate and releases it into the blood. The liver takes it up. - Liver lactate dehydrogenase converts lactate to pyruvate, making NADH in the cytoplasm. No NADH needs to be exported. - Pyruvate enters the matrix and pyruvate carboxylase makes oxaloacetate. PEP carboxykinase in the matrix converts oxaloacetate to PEP, which is then exported to the cytoplasm.</p>\n<p>The lecturer says this second version happens mainly during vigorous exercise that generates a lot of lactate.</p>\n<h2 id=\"the-cori-cycle\">The Cori cycle</h2>\n<p>The Cori cycle links muscle and liver. Working muscle takes glucose from the blood and makes pyruvate by glycolysis. When oxygen is limited, pyruvate is reduced to lactate, which regenerates NAD+ so glycolysis can continue. Lactate is secreted into the blood. The liver takes it up, converts it to glucose by gluconeogenesis, and secretes the glucose back into the blood. The lecturer also notes that some animals, such as alligators, that stay submerged for long periods rely on this same pattern: lactate built up anaerobically is converted back to glucose once oxygen is available.</p>\n<h2 id=\"carbon-sources-for-gluconeogenesis\">Carbon sources for gluconeogenesis</h2>\n<p>The liver may need up to around 100 grams of carbon during long fasts, so the source matters.</p>\n<p><strong>Lactate</strong> is a good carbon source (described above).</p>\n<p><strong>Citric acid cycle intermediates</strong> can feed into oxaloacetate and so into gluconeogenesis. However, the lecturer says they are not a sustainable source alone. Each round of the citric acid cycle takes in two carbons from acetyl-CoA and releases two CO2, so drawing oxaloacetate out of the cycle leaves fewer intermediates than before. Intermediates must be replenished to keep the cycle going.</p>\n<p><strong>Fatty acids are not a carbon source for gluconeogenesis.</strong> Fatty acids break down only to acetyl-CoA. Acetyl-CoA cannot be converted back to pyruvate (the PDH step is too exergonic to reverse), and acetyl-CoA entering the citric acid cycle does not produce a net gain of intermediates. The lecturer\u2019s conclusion is that fat cannot be converted to carbohydrate, though carbohydrate can be converted to fat. The glycerol backbone of a triglyceride is a three-carbon source that can be converted to DHAP, so glycerol can contribute to gluconeogenesis, but the fatty acid chains cannot.</p>\n<p><strong>Glucogenic amino acids</strong> are the main sustained carbon source during fasting. They can be broken down to pyruvate or to citric acid cycle intermediates, including succinyl-CoA. Some examples the lecturer gives are: - Glutamate, converted to alpha-ketoglutarate by a single enzyme. - Aspartate, converted to oxaloacetate by transamination, and asparagine, converted to aspartate. - Alanine, converted to pyruvate.</p>\n<p>Because these amino acids replenish the citric acid cycle, they provide a steady supply of carbon.</p>\n<h2 id=\"key-takeaways\">Key takeaways</h2>\n<ul>\n<li>Gluconeogenesis makes glucose from pyruvate and other carbon sources, mainly in the liver, and it is triggered by glucagon when blood glucose falls.</li>\n<li>The three bypasses are: pyruvate carboxylase plus PEP carboxykinase; fructose 1,6-bisphosphatase; and glucose-6-phosphatase.</li>\n<li>Making glucose costs 4 ATP, 2 GTP, and 2 NADH per glucose.</li>\n<li>Phosphofructokinase and fructose 1,6-bisphosphatase are reciprocally regulated.</li>\n<li>NADH for gluconeogenesis comes either from the matrix (via the malate shuttle) or from lactate (via the Cori cycle).</li>\n<li>Glucogenic amino acids, lactate, and glycerol can supply carbon. Fatty acids cannot.</li>\n</ul>\n", "mc": [{"n": 1, "q": "In mammals, gluconeogenesis occurs primarily in which organ?", "opts": ["Skeletal muscle", "Liver", "Brain", "Red blood cells"], "ans": "B", "why": "The liver is the most important organ for gluconeogenesis, with smaller contributions from the kidney and small intestine."}, {"n": 2, "q": "Which hormone is secreted by pancreatic alpha cells in response to a drop in blood glucose, and triggers gluconeogenesis in the liver?", "opts": ["Insulin", "Glucagon", "Lactate", "Adrenaline"], "ans": "B", "why": "Glucagon from pancreatic alpha cells signals the liver to turn on gluconeogenesis."}, {"n": 3, "q": "Which step of gluconeogenesis occurs in the mitochondrial matrix?", "opts": ["Conversion of PEP to 2-phosphoglycerate", "Conversion of pyruvate to oxaloacetate by pyruvate carboxylase", "Hydrolysis of glucose 6-phosphate to glucose", "Hydrolysis of fructose 1,6-bisphosphate to fructose 6-phosphate"], "ans": "B", "why": "Pyruvate carboxylase, which converts pyruvate to oxaloacetate, is the first step and occurs in the matrix."}, {"n": 4, "q": "What is the net cost of making one glucose molecule by gluconeogenesis, as stated in the lecture?", "opts": ["2 ATP", "4 ATP, 2 GTP, and 2 NADH", "2 NADH only", "6 ATP"], "ans": "B", "why": "The lecture gives 4 ATP, 2 GTP, and 2 NADH per glucose."}, {"n": 5, "q": "Which of the following is NOT one of the three bypass enzymes of gluconeogenesis?", "opts": ["Pyruvate carboxylase", "PEP carboxykinase", "Fructose 1,6-bisphosphatase", "Hexokinase"], "ans": "D", "why": "Hexokinase is a glycolysis step. The three gluconeogenesis bypasses are pyruvate carboxylase plus PEP carboxykinase, fructose 1,6-bisphosphatase, and glucose-6-phosphatase."}, {"n": 6, "q": "Why does the liver need glucose-6-phosphatase, while most other cells do not carry out this step?", "opts": ["The liver cannot phosphorylate glucose", "The liver needs to export free glucose to the blood, while most cells keep glucose phosphorylated and trapped", "Glucose-6-phosphatase makes ATP from glucose", "Glucose-6-phosphatase converts glucose into fructose"], "ans": "B", "why": "Most cells keep glucose phosphorylated so it stays in the cell. The liver's job is to export glucose into the blood, so it removes the phosphate."}, {"n": 7, "q": "Which statement about lactate in the lecture is correct?", "opts": ["The liver converts lactate to pyruvate, which generates NADH in the cytoplasm for gluconeogenesis", "Lactate cannot be used as a carbon source for gluconeogenesis", "Lactate is converted to acetyl-CoA in the liver", "Muscle takes lactate from the blood to make glucose"], "ans": "A", "why": "During vigorous exercise, the liver converts lactate to pyruvate, and the reaction produces NADH in the cytoplasm."}, {"n": 8, "q": "According to the lecture, which carbon source is NOT usable for gluconeogenesis?", "opts": ["Lactate", "Glucogenic amino acids", "Fatty acids", "The glycerol backbone of a triglyceride"], "ans": "C", "why": "Fatty acids break down only to acetyl-CoA, which cannot be converted back to pyruvate or produce a net gain of citric acid cycle intermediates. Lactate, glucogenic amino acids, and glycerol are sources."}, {"n": 9, "q": "Glucogenic amino acids can be broken down to which compounds?", "opts": ["Acetyl-CoA only", "Pyruvate or citric acid cycle intermediates", "Fatty acids", "Glucose-6-phosphate only"], "ans": "B", "why": "Glucogenic amino acids are those that can be broken down to pyruvate or to citric acid cycle intermediates, including succinyl-CoA."}, {"n": 10, "q": "Which statement correctly describes the regulation of phosphofructokinase and fructose 1,6-bisphosphatase in the liver?", "opts": ["Both are active at the same time when glucose is abundant", "A single allosteric regulator turns on phosphofructokinase and turns off fructose 1,6-bisphosphatase", "Glucagon turns on phosphofructokinase and turns off fructose 1,6-bisphosphatase", "Both are regulated only by changes in gene expression"], "ans": "B", "why": "The lecture describes a single allosteric regulator that turns on phosphofructokinase and turns off fructose 1,6-bisphosphatase. Glucagon acts by breaking this regulator down."}], "sa": [{"n": 11, "q": "Explain why citric acid cycle intermediates alone cannot sustain gluconeogenesis, and describe what the lecture says is needed to replenish them.", "a": "Oxaloacetate, a citric acid cycle intermediate, is the entry point for carbon into gluconeogenesis. However, each round of the citric acid cycle takes in two carbons from acetyl-CoA and releases two CO2, so the number of intermediates does not increase. If intermediates are drawn off to make glucose without being replaced, the cycle eventually runs out. The lecture says the intermediates need to be replenished, and that amino acids are the main way this happens. Glucogenic amino acids are converted to citric acid cycle intermediates, which restores the pool."}, {"n": 12, "q": "Describe the two versions of the first bypass (pyruvate to PEP). For each, explain where the NADH needed for gluconeogenesis comes from.", "a": "In version 1, the NADH is exported from the matrix. Matrix NADH from the PDH complex and citric acid cycle is used to convert oxaloacetate to malate. Malate crosses the membrane and is converted back to oxaloacetate in the cytoplasm, regenerating NADH there. Cytoplasmic oxaloacetate is then converted to PEP. In version 2, the NADH comes from lactate. Lactate from vigorous muscle exercise is taken up by the liver and converted to pyruvate by lactate dehydrogenase, making cytoplasmic NADH. Pyruvate enters the matrix, where pyruvate carboxylase and matrix PEP carboxykinase convert it to PEP, which is exported."}, {"n": 13, "q": "Explain why the lecture says a fasting liver cannot make glucose from fatty acids, even though it can break fatty acids down. Include the role of acetyl-CoA in your answer.", "a": "Fatty acids are broken down to acetyl-CoA, and that is their only breakdown product. Acetyl-CoA cannot be converted back to pyruvate, because the PDH step is far too exergonic to reverse. When acetyl-CoA enters the citric acid cycle, the number of intermediates does not change, so it does not replenish oxaloacetate for gluconeogenesis. Fat therefore cannot be converted to carbohydrate. The reverse is easy: carbohydrate can be converted to acetyl-CoA and then to fatty acids. The glycerol part of a triglyceride is a separate three-carbon source that can enter as DHAP."}]}];

function renderQuiz(L, li) {

  let html = `<div class="card"><h2>Lecture ${L.num} quiz: ${L.title}</h2>`;
  html += `<div id="ls-${li}" class="lecture-score"></div>`;
  L.mc.forEach(q => {

    const chosen = st[q.n];
    q.opts.forEach((o, idx) => {
      const letter = "ABCD"[idx];
      let cls = "opt";
      if (chosen) {

        else if (letter === chosen) cls += " wrong";
      }
      html += `<button class="${cls}" ${chosen ? "disabled" : ""} onclick="pick(${li},${q.n},'${letter}')">${letter}. ${o}</button>`;
    });
    if (chosen) {
      const ok = chosen === q.ans;
      html += `<p class="feedback ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite. The answer is " + q.ans + "."}</p>`;
      html += `<p class="why">${q.why}</p>`;
    }
    html += `</div>`;
  });
  html += `<button class="reset" onclick="resetLecture(${li})">Reset this lecture's quiz</button></div>`;
  html += `<div class="card"><h2>Short-answer questions</h2>`;
  L.sa.forEach((s, k) => {
    const id = `sa-${li}-${k}`;
    html += `<div style="margin-top:14px"><p class="q">${s.n}. ${s.q}</p>
      <button class="reveal" onclick="document.getElementById('${id}').classList.toggle('show')">Show model answer</button>
      <div id="${id}" class="answer">${s.a}</div></div>`;
  });
  html += `</div>`;
  return html;
}

function lectureScore(li) {
  const L = LECTURES[li];
  const st = state[li] || {};
  let c = 0, a = 0;
  Object.entries(st).forEach(([n, letter]) => { a++; const q = L.mc.find(x => x.n == n); if (q && q.ans === letter) c++; });
  return `${c} of ${L.mc.length} correct so far`;
}

function pick(li, n, letter) {
  const st = state[li] || (state[li] = {});
  if (st[n]) return;
  st[n] = letter;
  render();
}

function resetLecture(li) {
  state[li] = {};
  render();
}

function render() {
  buildNav();
  totals();
  const panel = document.getElementById("panel");
  const L = LECTURES[current];
  panel.innerHTML = mode === "study" ? renderStudy(L) : renderQuiz(L, current);
  if (mode === "quiz") {
    const el = document.getElementById(`ls-${current}`);
    if (el) el.textContent = lectureScore(current);
  }
  document.getElementById("tab-study").classList.toggle("active", mode === "study");
  document.getElementById("tab-quiz").classList.toggle("active", mode === "quiz");
}

document.getElementById("tab-study").onclick = () => { mode = "study"; render(); };
document.getElementById("tab-quiz").onclick = () => { mode = "quiz"; render(); };
render();
</script>
</body>
</html>
