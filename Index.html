<script>
const LECTURES = [{"num": 1, "title": "Course Introduction, Amino Acids, and Protein Structure", "guide": "<h1 id=\"lecture-1-study-guide-course-introduction-amino-acids-and-protein-structure\">Lecture 1 Study Guide: Course Introduction, Amino Acids, and Protein Structure</h1>\n<h2 id=\"the-story-of-the-course-energy\">The story of the course: energy</h2>\n<p>The lecture frames metabolic biochemistry as a story about energy and how it moves through living cells. The original source of energy for nearly all life is sunlight, which plants capture through photosynthesis and convert into carbohydrates. Photosynthesis itself is not covered in this course. The course instead picks up at the point where the carbohydrates are used: how cells extract energy from them and turn it into a form that powers movement and other activity.</p>\n<p>The lecturer notes that the course has a reputation for heavy memorization, but says the better approach is to follow the energy through each reaction. Some memorization is needed at the start, the way a language requires vocabulary, but the reactions fit together once you track where the energy goes.</p>\n<h2 id=\"glycolysis-as-an-example\">Glycolysis as an example</h2>\n<p>Glycolysis is used as the first worked example. It has ten reactions and partially oxidizes glucose to release some of its energy. The lecturer says that only one reaction in the pathway is the truly important one, and that the others mainly set up that reaction and handle what follows; the transcript does not say which reaction that is. Seven of the ten glycolysis reactions are reversible. Because of this, most of glycolysis physiologically runs in reverse during gluconeogenesis, which synthesizes glucose.</p>\n<p>The lecturer compares glucose oxidation to combustion. Both end in water and carbon dioxide, but the cell performs the oxidation in controlled, stepwise reactions that capture energy as ATP. Two proteins named in the lecture are hexokinase, which starts glycolysis, and ATP synthase, which is involved in making ATP.</p>\n<h2 id=\"amino-acids-the-generic-structure\">Amino acids: the generic structure</h2>\n<p>Proteins are chains of amino acids joined by peptide bonds. Every amino acid has a central carbon called the alpha carbon. Attached to it are an alpha carboxylic acid group, an alpha amino group, a hydrogen atom (all amino acids except proline), and a side chain called the R group. There are 20 amino acids that make up proteins, and they differ only in their R groups. The alpha carbon is a chiral center in every amino acid except glycine.</p>\n<p>At physiologic pH (about 7), the alpha carboxyl group loses its proton and exists in the proton-acceptor (carboxylate) form. The alpha amino group acts as a weak base and picks up a proton, giving the nitrogen a positive charge. The name \u201camino acid\u201d reflects the amino group on a carboxylic acid.</p>\n<h2 id=\"classifying-the-r-groups\">Classifying the R groups</h2>\n<p>The lecturer groups the 20 amino acids by R-group chemistry. Nonpolar aliphatic R groups (such as glycine, alanine, proline, valine, isoleucine, and methionine) are hydrophobic. Polar but uncharged R groups carry a hydroxyl or thiol, or an amide as in asparagine and glutamine, and can take part in hydrogen bonding. Aromatic R groups include phenylalanine, tyrosine, and tryptophan. Basic R groups pick up a proton and carry a positive charge; lysine and arginine are the clearest examples, and histidine has a pKa near 6, so it is essentially neutral at physiologic pH but can become positive at lower pH. Acidic R groups are carboxylic acids: aspartate and glutamate (the charged forms of aspartic acid and glutamic acid).</p>\n<p>The lecturer says you do not need to memorize all 20 structures. The structures you are expected to know are five: alanine, aspartate, asparagine, glutamate, and glutamine. The transcript does not list these five in one place, but the lecturer\u2019s later discussion names them, so this list is inferred from the lecture.</p>\n<h2 id=\"interconversion-with-alpha-keto-acids\">Interconversion with alpha-keto acids</h2>\n<p>Amino acids are frequently converted to their corresponding alpha-keto acids. The amino group is removed, either by transfer to another molecule or by loss of ammonia, and a carbonyl oxygen takes its place on the alpha carbon. The R group is unchanged. The lecturer uses this to tie amino acid metabolism to the rest of the course.</p>\n<p>Alanine is converted to pyruvate in a single enzyme-catalyzed transamination, and pyruvate is the end product of glycolysis (each glucose gives two pyruvate molecules). This links amino acid metabolism to carbohydrate metabolism. Aspartate becomes oxaloacetate, a citric acid cycle intermediate, and glutamate becomes alpha-ketoglutarate, another citric acid cycle intermediate. Asparagine is the amide of aspartate and glutamine is the amide of glutamate; each is made by adding an amino group to the side-chain carboxyl of its parent amino acid. The lecturer\u2019s point is that once you know a few structures, the rest can be derived from the reactions that connect them.</p>\n<h2 id=\"peptide-bonds-and-polypeptides\">Peptide bonds and polypeptides</h2>\n<p>Two amino acids are joined by a peptide bond, which is an amide linkage formed as the carboxyl group of one amino acid loses its oxygen and bonds to the amino group of the next. The result is a dipeptide, and longer chains are built the same way. The peptide bond has partial double-bond character from resonance, so it cannot rotate freely. This restricts how the chain can twist and fold. The chain has a free amino end, the N-terminus, and a free carboxyl end, the C-terminus, which gives it a direction. Residues are numbered from the N-terminus, so a serine at position 255 is serine 255. In the lecturer\u2019s five-residue example, serine is 1, glycine 2, tyrosine 3, alanine 4, and valine 5.</p>\n<p>A polypeptide is not yet a protein. The lecturer says proteins are typically at least 50 to 100 amino acids long, and that a loose, unfolded chain is not functional. The chain must fold, driven by interactions among its R groups and backbone atoms.</p>\n<h2 id=\"levels-of-protein-structure\">Levels of protein structure</h2>\n<p>Primary structure is the linear amino acid sequence. Secondary structure is the local folding produced by backbone hydrogen bonds: the alpha helix and the beta pleated sheet are the two ordered forms, and loose coil connects them. In both, the R groups point outward and do not take part in the hydrogen bonding that forms the structure. In an alpha helix, a hydrogen bond forms between the carbonyl oxygen of one residue and the amino hydrogen of a residue three to four positions further along.</p>\n<p>Tertiary structure is the overall folded shape of a single polypeptide, driven mainly by interactions among R groups: hydrophobic interactions, hydrogen bonds, and ionic bonds. Hydrophobic R groups tend to cluster in the interior of the protein, away from water. Disulfide bonds, which are covalent bonds between the thiol groups of two cysteine residues, are the only covalent bond the lecturer names in forming tertiary structure. Quaternary structure is the assembly of multiple polypeptide subunits, which can be identical copies or different chains. Many metabolic enzymes have quaternary structure.</p>\n<p>The lecturer uses myoglobin as an example. It is an oxygen-binding protein in muscle with a heme group bound to it, and it is a single polypeptide, so it has no quaternary structure. Ribbon diagrams show only the backbone and hide most of the protein\u2019s bulk, which is the R groups, so the lecturer also shows space-filling and surface models.</p>\n<h2 id=\"hexokinase-and-protein-flexibility\">Hexokinase and protein flexibility</h2>\n<p>Hexokinase catalyzes the first reaction of glycolysis. It transfers a phosphate from ATP to glucose to form glucose 6-phosphate. Its active site is a cleft where glucose and ATP bind. When glucose binds, the enzyme changes shape and clamps down on the substrate, which is the induced fit model discussed in more detail in Lecture 2. The lecturer\u2019s main point is that all proteins are flexible, and that this ability to move and change shape is part of how they carry out their function. Because enzymes are proteins, this flexibility matters for enzyme catalysis, which is the subject of the next lectures.</p>\n", "mc": [{"n": 1, "q": "According to the lecture, what is the original source of energy for nearly all life on Earth?", "opts": ["Glucose in food", "Sunlight", "ATP", "Geothermal heat"], "ans": "B", "why": "Sunlight, captured by plants through photosynthesis, is the original energy source."}, {"n": 2, "q": "How many of the ten reactions of glycolysis are reversible, according to the lecturer?", "opts": ["3", "5", "7", "10"], "ans": "C", "why": "Seven of the ten glycolysis reactions are reversible."}, {"n": 3, "q": "What is the name of the process by which most of glycolysis runs in reverse to synthesize glucose?", "opts": ["Glycogenolysis", "Gluconeogenesis", "Photosynthesis", "Transamination"], "ans": "B", "why": "Gluconeogenesis runs most of glycolysis in reverse to synthesize glucose."}, {"n": 4, "q": "Which set of features is common to every amino acid in the lecture's generic structure?", "opts": ["A central alpha carbon bearing an amino group and a carboxylic acid group", "A phosphate group and a ribose sugar", "A disulfide bond and a thiol group", "A peptide bond and a free C-terminus"], "ans": "A", "why": "Every amino acid has a central alpha carbon with an alpha amino group and an alpha carboxylic acid group, plus a hydrogen (except proline) and an R group."}, {"n": 5, "q": "Which amino acid is the exception to the rule that the alpha carbon is a chiral center?", "opts": ["Alanine", "Glycine", "Proline", "Serine"], "ans": "B", "why": "Glycine is the exception; its alpha carbon is not chiral."}, {"n": 6, "q": "When alanine is converted to pyruvate in a single transamination, what happens to the amino group?", "opts": ["It is replaced by a carbonyl oxygen on the alpha carbon, with the amino group removed by transfer or loss as ammonia", "It is replaced by a phosphate group from ATP", "It is converted into a disulfide bond", "It is retained and pyruvate gains a second amino group"], "ans": "A", "why": "The amino group is removed, by transfer to another molecule or as ammonia, and a carbonyl oxygen is placed on the alpha carbon."}, {"n": 7, "q": "Asparagine is best described as which of the following?", "opts": ["The amide of aspartate", "The amide of glutamate", "The alpha-keto acid of alanine", "The phosphorylated form of serine"], "ans": "A", "why": "Asparagine is the amide of aspartate, made by adding an amino group to the aspartate side-chain carboxyl."}, {"n": 8, "q": "At physiologic pH, what is the state of the alpha carboxyl group?", "opts": ["Protonated, as a carboxylic acid", "Deprotonated, as the proton-acceptor form", "Replaced by an amino group", "Covalently bonded to the R group"], "ans": "B", "why": "At physiologic pH the alpha carboxyl group is deprotonated, in the proton-acceptor form."}, {"n": 9, "q": "Why does the peptide bond not allow free rotation?", "opts": ["It is an ionic bond between two charged R groups", "It is a disulfide bond", "It has partial double-bond character from resonance", "It contains a phosphate group"], "ans": "C", "why": "Resonance gives the peptide bond partial double-bond character, which restricts rotation."}, {"n": 10, "q": "Which level of protein structure is formed by hydrogen bonding between atoms of the polypeptide backbone, with R groups pointing away from the structure?", "opts": ["Primary", "Secondary", "Tertiary", "Quaternary"], "ans": "B", "why": "Secondary structure (alpha helix and beta pleated sheet) is formed by backbone hydrogen bonds."}], "sa": [{"n": 11, "q": "Describe the four levels of protein structure as the lecturer presents them, and name the main type of interaction that drives each level.", "a": ""}, {"n": 12, "q": "Explain why the lecturer says that a loose polypeptide chain is not yet a functional protein, and describe the role of R-group interactions in folding.", "a": ""}, {"n": 13, "q": "Explain how the lecturer connects amino acid metabolism to the citric acid cycle and glycolysis, using alanine, aspartate, and glutamate as examples.", "a": ""}]}, {"num": 2, "title": "Biochemical Thermodynamics", "guide": "<h1 id=\"lecture-2-study-guide-biochemical-thermodynamics\">Lecture 2 Study Guide: Biochemical Thermodynamics</h1>\n<h2 id=\"why-thermodynamics-matters-for-metabolism\">Why thermodynamics matters for metabolism</h2>\n<p>Metabolism is made of individual chemical reactions organized into pathways. Many of these reactions run in both directions in the cell, so to understand a pathway you need to know energetically which way each reaction will go at a given moment, and what determines that direction. The lecture also asks what enzymes actually do to make these reactions compatible with life. The lecturer assumes you already know general chemistry concepts: rate constants, reactants and products, velocity (the rate constant times reactant concentrations, with the net rate equal to the forward rate minus the reverse rate), and the equilibrium constant. A general chemistry reading on the properties of chemical reactions is referenced on Canvas for review.</p>\n<h2 id=\"gibbs-free-energy-and-the-reaction-diagram\">Gibbs free energy and the reaction diagram</h2>\n<p>The lecture uses a Gibbs free energy diagram, with Gibbs free energy (symbol G, in joules) on the y-axis and the reaction coordinate, the progress of the reaction, on the x-axis. Reactants start at one energy level and products end at another. The transition state, where bonds are breaking and forming, sits at the top of an energy hump, and the height of that hump above the reactants is the activation energy. The difference in free energy between products and reactants is the change in free energy, delta G. When products have less free energy than reactants, the reaction is exergonic. When products have more, it is endergonic. The energy released in an exergonic reaction often appears as heat or is transduced into other forms.</p>\n<h2 id=\"enthalpy-entropy-and-g-h-minus-ts\">Enthalpy, entropy, and G = H minus TS</h2>\n<p>Gibbs free energy is defined as enthalpy minus the temperature times entropy: G = H - TS. Enthalpy is the energy contained in chemical bonds, and some bonds hold much more energy than others. The lecturer\u2019s example is ATP, where the three phosphate groups carry strongly repelling negative charges, so the oxygen-phosphorus bonds are under strain and carry high enthalpy. Entropy is the degree of randomness in a system. The lecturer frames this in terms of organization: more organization means lower entropy and, in this framing, higher free energy. Free nucleotides floating in solution have high entropy, while the same nucleotides ordered into a DNA strand have lower entropy and higher free energy. The lecturer states that the course does not require solving equations with G = H - TS, but that the conceptual components are needed to understand enzymes.</p>\n<h2 id=\"standard-and-biochemical-standard-free-energy\">Standard and biochemical standard free energy</h2>\n<p>The standard free energy change, delta G-naught, is measured with reactants and products at 1 molar and gases at 1 atmosphere, at 25 degrees Celsius. The lecturer points out that this does not work for biochemistry because hydrogen ions would have to be 1 molar, which is far too acidic for the cell to survive. The biochemical standard free energy change, delta G-naught-prime, adds constraints that reflect cellular conditions: pH 7, so hydrogen ions are 10 to the minus 7 molar; magnesium ions fixed at 1 millimolar, because 1 molar magnesium would disrupt proteins; and a temperature of 310 K (37 degrees Celsius), which is used for all calculations in this course. In this course, \u201cstandard free energy change\u201d means delta G-naught-prime under those conditions.</p>\n<p>A negative standard free energy change (delta G-naught-prime less than zero) means the reaction is thermodynamically favorable and tends to go forward. A positive value means it tends not to go forward. The lecturer warns that the sign alone does not settle which way a reaction goes in the cell, because concentrations also matter.</p>\n<h2 id=\"the-equilibrium-constant\">The equilibrium constant</h2>\n<p>The equilibrium constant, Keq, is the product of equilibrium product concentrations divided by the product of equilibrium reactant concentrations. The standard free energy change and the equilibrium constant are two sides of the same relationship: delta G-naught-prime = -RT ln Keq, where R is 8.315 J per mol per K and T is 310 K. RT at 310 K is about 2.578 kJ per mol, which the lecturer recomputes in the worked example. The lecturer says exam problems will supply the gas constant.</p>\n<p>In the worked example, glucose 6-phosphate plus water gives free glucose and phosphate, with delta G-naught-prime of -13.8 kJ per mol. Dividing -13.8 by -2.578 gives the natural log of Keq, about 5.35, and taking the antilog gives a Keq of about 211. The rules the lecturer draws from this: a Keq above 1 corresponds to a negative delta G-naught-prime and a thermodynamically favorable forward reaction, and the further above 1 the Keq is, the more exergonic the reaction. A Keq below 1 gives a positive value, and a Keq of 1 gives a standard free energy change of zero.</p>\n<h2 id=\"magnitude-matters\">Magnitude matters</h2>\n<p>The size of the standard free energy change determines how far a reaction can be pushed by concentrations. ATP hydrolysis at the gamma phosphate, with delta G-naught-prime of -30.5 kJ per mol, is so exergonic that the reverse reaction cannot happen spontaneously: the phosphate cannot simply come out of solution and reattach to ADP. Many glycolytic reactions have small standard free energy changes, such as around -1.5 kJ per mol, and these can be pushed in either direction by reactant and product concentrations.</p>\n<h2 id=\"actual-free-energy-change-and-concentrations\">Actual free energy change and concentrations</h2>\n<p>The actual free energy change, delta G, depends on the standard value plus the concentrations of reactants and products through the mass action ratio, Q: delta G = delta G-naught-prime + RT ln Q. The actual free energy change determines the direction of a reaction in the cell. A negative actual value means the forward direction; a positive value means the reverse. A value of zero means the reaction is at equilibrium and the net rate is zero. Cellular concentrations are never 1 molar, since they would precipitate in the crowded cell. Because concentrations change as reactions proceed, the actual free energy change is never fixed. Flux through a pathway depends on whether product concentrations at the end or reactant concentrations at the beginning are higher.</p>\n<h2 id=\"activation-energy-and-rate\">Activation energy and rate</h2>\n<p>Activation energy, delta G-double-dagger, is the free energy that must be acquired for reactants to reach the transition state. It is always positive. The lecturer breaks it into two parts. The enthalpy component is the strain that must be put on existing bonds so they can break and new bonds can form. The entropy component is the organization that reactants must acquire to be oriented correctly for the reaction, for example when two molecules must collide with the correct groups aligned. Activation energy determines the rate: it is inversely related to the rate constant, and the lecturer stresses that a small decrease in activation energy produces an exponentially large increase in the rate constant.</p>\n<p>The example is hydrogen peroxide breaking down slowly to water and oxygen over years. Adding one drop of the enzyme catalase speeds the reaction by about one billion times, which the lecturer uses to illustrate what enzymes do.</p>\n<h2 id=\"how-enzymes-work\">How enzymes work</h2>\n<p>An enzyme has an active site, a cleft or pocket in its folded structure where substrates bind. Substrates are the reactants of an enzyme-catalyzed reaction. Binding is specific, because the substrate\u2019s shape and the active site\u2019s shape fit together, and R groups from the enzyme\u2019s amino acids in the active site participate in catalysis. Binding begins with weak interactions such as hydrogen bonds and hydrophobic interactions. As substrate binds, the enzyme changes shape and moves into its induced fit conformation, which fits the substrate best. The lecturer says the reaction is at the transition state when the enzyme is in this conformation.</p>\n<p>The enzyme lowers activation energy in two ways. On the enthalpy side, binding strains the substrate\u2019s bonds, which adds energy to the bound substrate and means less additional strain is needed to reach the transition state. On the entropy side, binding aligns substrates, either with each other or with active-site R groups, reducing the organization that must be imposed. The lecturer gives dihydrofolate reductase as an example of aligning two substrates, dihydrofolate and NADP, so that electrons can transfer between them. The chymotrypsin example shows an active-site serine attacking a peptide bond, where the substrate must be positioned correctly for the attack. The lecturer says the binding energy comes from the exergonic binding of substrate to enzyme, which drives the induced fit shift and helps pay for the strain.</p>\n<p>Enzymes do not change the overall thermodynamics of a reaction. They do not change the standard free energy change, the equilibrium constant, or the actual free energy change. They lower the activation energy for both the forward and reverse reactions by the same amount, so they speed up both directions equally. The direction of the net reaction is still set by substrate and product concentrations, which is why enzymes make reversible metabolic reactions possible.</p>\n", "mc": [{"n": 1, "q": "In the equation G = H - TS, what does enthalpy (H) represent?", "opts": ["The randomness of the system", "The energy contained in the chemical bonds of the molecules", "The temperature of the system", "The concentration of reactants and products"], "ans": "B", "why": "Enthalpy is the energy contained in chemical bonds."}, {"n": 2, "q": "According to the lecture, what happens to Gibbs free energy as entropy (randomness) increases?", "opts": ["Free energy increases", "Free energy decreases", "Free energy is unchanged", "Free energy becomes equal to enthalpy"], "ans": "B", "why": "Higher entropy (more randomness) gives lower free energy in the lecture's framing."}, {"n": 3, "q": "Which of the following is NOT one of the constraints built into the biochemical standard free energy change (delta G-naught-prime)?", "opts": ["pH 7", "Magnesium ions at 1 millimolar", "A temperature of 310 K", "Hydrogen ions at 1 molar"], "ans": "D", "why": "The biochemical standard uses pH 7 (hydrogen ions at 10 to the minus 7 molar), not 1 molar hydrogen ions. The others are constraints."}, {"n": 4, "q": "A reaction has an equilibrium constant (Keq) of 211. What does this indicate?", "opts": ["The reaction is endergonic and unfavorable", "The reaction is exergonic and thermodynamically favorable", "The reaction is at equilibrium with delta G equal to zero", "The reaction cannot proceed in either direction"], "ans": "B", "why": "A Keq greater than 1 corresponds to a negative standard free energy change, an exergonic and favorable reaction."}, {"n": 5, "q": "Using the relationship delta G-naught-prime = -RT ln Keq at 310 K, what is the standard free energy change when Keq equals 1?", "opts": ["+1 kJ per mol", "-1 kJ per mol", "0 kJ per mol", "It cannot be determined"], "ans": "C", "why": "ln 1 = 0, so delta G-naught-prime is zero."}, {"n": 6, "q": "Why does the lecture say ATP hydrolysis at the gamma phosphate (delta G-naught-prime of -30.5 kJ per mol) cannot reverse on its own?", "opts": ["It is a very small value and so the reaction is too slow to reverse", "It is a very large negative value, so the phosphate cannot spontaneously reattach to ADP", "Hydrogen ions prevent the reverse reaction", "Enzymes are required to make ATP from ADP and phosphate, which are absent"], "ans": "B", "why": "The large negative value makes the reverse reaction impossible on its own, since the phosphate cannot come out of solution and reattach to ADP."}, {"n": 7, "q": "Which equation describes the actual free energy change in the cell?", "opts": ["delta G = delta G-naught-prime - RT ln Q", "delta G = delta G-naught-prime + RT ln Q", "delta G = RT ln Keq", "delta G = delta H - delta S"], "ans": "B", "why": "The actual free energy change is delta G-naught-prime plus RT ln Q, where Q is the mass action ratio."}, {"n": 8, "q": "Which statement about enzymes is correct according to the lecture?", "opts": ["Enzymes change the equilibrium constant of a reaction", "Enzymes change the standard free energy change", "Enzymes lower the activation energy for both the forward and reverse reactions by the same amount", "Enzymes change the actual free energy change, making reactions irreversible"], "ans": "C", "why": "Enzymes lower the activation energy of forward and reverse reactions by the same amount and do not affect thermodynamic quantities."}, {"n": 9, "q": "In the lecture's breakdown of activation energy, what does the enthalpy component represent?", "opts": ["Organization that reactants must acquire to be correctly aligned", "Strain that must be placed on existing bonds so they can break", "The temperature of the solvent", "The concentration of product molecules"], "ans": "B", "why": "The enthalpy part of activation energy is the strain on existing bonds needed for them to break."}, {"n": 10, "q": "What is the lecture's description of substrate binding to an enzyme?", "opts": ["It is endergonic and requires energy from ATP", "It is at least partly exergonic and helps drive the enzyme into its induced fit conformation", "It has no effect on the enzyme's shape", "It always produces a covalent bond between enzyme and substrate"], "ans": "B", "why": "Substrate binding is at least partly exergonic and drives the enzyme into its induced fit conformation."}], "sa": [{"n": 11, "q": "Using glucose 6-phosphate hydrolysis (delta G-naught-prime of -13.8 kJ per mol at 310 K), walk through how to calculate the equilibrium constant, and state what the result tells you about the reaction's favorability.", "a": ""}, {"n": 12, "q": "Explain why a reaction with a negative standard free energy change can still run in reverse inside a cell, and identify what actually determines the direction the reaction goes.", "a": ""}, {"n": 13, "q": "Explain how enzymes lower the activation energy, describing the enthalpy and entropy components. Then explain why enzymes do not change the direction of a reaction or its equilibrium position.", "a": ""}]}, {"num": 3, "title": "More Information on Enzymes", "guide": "<h1 id=\"lecture-3-study-guide-more-information-on-enzymes\">Lecture 3 Study Guide: More Information on Enzymes</h1>\n<h2 id=\"overview\">Overview</h2>\n<p>This lecture covers three practical topics that matter for metabolism: enzyme cofactors, enzyme classification and nomenclature, and enzyme regulation. The lecturer presents classification as useful because knowing an enzyme\u2019s class tells you what kind of reaction it catalyzes, which in turn tells you the role of that reaction in its pathway.</p>\n<h2 id=\"cofactors\">Cofactors</h2>\n<p>Cofactors are helper molecules that take part in an enzyme\u2019s catalytic mechanism. There are two kinds. The first is metal ions, such as magnesium, iron, and copper. Oxidoreductases often use iron or copper, which can pick up single electrons one at a time during catalysis. Magnesium binds ATP well, so enzymes that bind ATP, such as kinases, almost always have a magnesium cofactor.</p>\n<p>The second kind is coenzymes, which are small organic molecules that directly take part in the reaction. Some coenzymes are substrates that bind, pick up a chemical group, leave, and carry it to other enzymes elsewhere in the cell. The lecturer\u2019s examples are NAD, which carries electrons as NADH, and coenzyme A, which carries acetyl groups as acetyl-CoA. Other coenzymes are prosthetic groups, which stay permanently bound to the active site and take part in catalysis there.</p>\n<h2 id=\"the-six-enzyme-classes\">The six enzyme classes</h2>\n<p>The lecturer describes six classes, and the class name tells you the type of reaction. Oxidoreductases catalyze oxidation-reduction reactions; the lecturer says there are several types, to be covered later. Transferases move a chemical group, such as a methyl or acetyl group, from one substrate molecule to a different one. Hydrolases cut molecules by bringing in a water molecule, which becomes a hydroxyl on one of the products. Nucleases, proteases, and lipases are hydrolases, and chymotrypsin, which cuts a peptide bond, is the lecturer\u2019s example. Lyases catalyze the removal of a group to form a double bond, or the addition of a group across a double bond, typically by adding or removing water. The lyases in this course are reversible. Isomerases rearrange atoms or bonds within a single molecule without removing electrons, chemical groups, or carbons. In metabolism, isomerization reactions have a very low overall standard free energy change, so they go easily in either direction. Ligases form new covalent bonds, typically in condensation reactions between two reactants, and because forming a covalent bond requires energy, they use an additional substrate such as ATP to supply it.</p>\n<h2 id=\"kinases-and-phosphatases\">Kinases and phosphatases</h2>\n<p>Kinases are transferases that move a phosphate group. In general, a kinase transfers a phosphate from ATP onto another substrate, or from a high-energy substrate onto ADP to make ATP, and these reactions can go in either direction. The lecturer notes that there are four kinases in glycolysis. Protein kinases are a subset that only move phosphates from ATP onto a target protein, and they cannot run in reverse because that would not be thermodynamically favorable. The reverse action is carried out by protein phosphatases, which are hydrolases that remove the phosphate by simple hydrolysis, releasing free phosphate into solution.</p>\n<h2 id=\"two-modes-of-enzyme-regulation\">Two modes of enzyme regulation</h2>\n<p>The lecturer says there are only two ways cells regulate enzyme activity: allosteric regulation and reversible covalent modification. Cells need regulation because if every pathway ran at full speed, metabolism would be chaos. Regulating individual enzymes controls the flux through each pathway so that metabolism is coordinated.</p>\n<p>Allosteric regulation is reversible binding of a small effector molecule, controlled by its cellular concentration, at a site separate from the active site. The effector can increase or decrease catalytic activity. This contrasts with ordinary inhibitors, which bind the active site. Cyclic AMP, which is produced by signal transduction, and calcium ions are the lecturer\u2019s examples. Allosteric enzymes are usually multi-subunit proteins with a catalytic subunit that holds the active site and a regulatory subunit that holds the allosteric site. When an effector binds the regulatory subunit, it changes that subunit\u2019s shape, which in turn changes the catalytic subunit\u2019s conformation and access to the active site. The lecturer says homotropic allosteric regulation, in which the substrate itself acts as the regulator, is outside the course; when the course refers to allosteric regulation, it means heterotropic regulation by a molecule other than the substrate.</p>\n<p>Feedback inhibition is a classic form of allosteric regulation in which the end product of a pathway binds the regulatory site of the first enzyme in that pathway and turns it off. The lecturer uses a bacterial pathway that makes isoleucine from threonine through five enzyme-catalyzed steps. The first enzyme, threonine dehydratase, is the rate-limiting, regulated step. When isoleucine accumulates, it binds the allosteric sites on threonine dehydratase and shuts the pathway down. When isoleucine levels drop, it unbinds and the pathway resumes. The lecturer adds that isoleucine synthesis is found only in bacteria, not in animals. High-energy products of catabolic pathways, such as ATP and NADH, often serve as allosteric regulators that turn off enzymes at the start of energy-producing pathways.</p>\n<p>Reversible covalent modification is the addition or removal of a chemical group on an enzyme, which turns its activity up or down. Unlike allosteric binding, this always requires a second enzyme to attach the group. Methyl groups, acetyl groups, and nucleotides are among the possible groups. The lecturer identifies protein phosphorylation as the primary mode of this regulation. Protein kinases attach a phosphate from ATP to serine, threonine, or tyrosine, which carry hydroxyl groups on their R groups. Phosphorylation is sequence-dependent, meaning the kinase attaches the phosphate at a specific amino acid in a specific sequence context. Adding a bulky group with two negative charges shifts the enzyme\u2019s conformation and changes its activity. Phosphatases reverse the process.</p>\n<h2 id=\"regulation-is-a-continuum\">Regulation is a continuum</h2>\n<p>The lecturer ends with the point that regulation all comes down to shape. Both allosteric binding and phosphorylation change the enzyme\u2019s conformation. Regulation is also rarely all or nothing. Partial effector binding or partial phosphorylation can produce a range of activity, so cells can fine-tune how much material flows through a pathway at any given time.</p>\n", "mc": [{"n": 1, "q": "What is a prosthetic group, as the lecturer defines it?", "opts": ["A substrate that binds, picks up a group, and leaves", "A coenzyme that stays permanently bound to the enzyme's active site", "A metal ion that binds ATP", "An allosteric effector that binds outside the active site"], "ans": "B", "why": "A prosthetic group is a coenzyme that is permanently bound to the active site."}, {"n": 2, "q": "Which coenzyme carries acetyl groups, according to the lecture?", "opts": ["NAD", "NADP", "Coenzyme A", "ATP"], "ans": "C", "why": "Coenzyme A carries acetyl groups as acetyl-CoA."}, {"n": 3, "q": "Which enzyme class moves a chemical group, such as a methyl or acetyl group, from one substrate molecule to a different substrate molecule?", "opts": ["Lyases", "Transferases", "Isomerases", "Ligases"], "ans": "B", "why": "Transferases move chemical groups between two different substrate molecules."}, {"n": 4, "q": "A protease is an example of which enzyme class?", "opts": ["Hydrolase", "Lyase", "Isomerase", "Ligase"], "ans": "A", "why": "Proteases are hydrolases, which cut molecules by bringing in water."}, {"n": 5, "q": "What characterizes an isomerase reaction in the lecture?", "opts": ["It removes electrons from a substrate", "It rearranges bonds and groups within the same molecule without removing atoms or electrons", "It forms a new covalent bond using ATP", "It moves a phosphate from ATP onto a protein"], "ans": "B", "why": "Isomerases rearrange atoms and bonds inside the same substrate."}, {"n": 6, "q": "Why do ligases typically require an additional substrate such as ATP?", "opts": ["Forming a covalent bond requires energy", "Ligases must break a disulfide bond first", "Ligases can only work in the reverse direction", "ATP is needed to bind metal cofactors"], "ans": "A", "why": "Forming a covalent bond requires energy, which ligases obtain from ATP or a similar substrate."}, {"n": 7, "q": "How many kinases does the lecturer say are present in glycolysis?", "opts": ["Two", "Three", "Four", "Ten"], "ans": "C", "why": "The lecturer says there are four kinases in glycolysis."}, {"n": 8, "q": "Which statement about protein kinases is correct according to the lecture?", "opts": ["They can run in either direction, making ATP from a phosphorylated protein", "They only transfer phosphate from ATP onto a substrate protein, and cannot reverse", "They are always hydrolases", "They are used to attach methyl groups to DNA"], "ans": "B", "why": "Protein kinases transfer phosphate from ATP to a protein in one direction only."}, {"n": 9, "q": "Where does an allosteric effector bind, according to the lecture?", "opts": ["In the enzyme's active site", "At an allosteric site separate from the active site, on the regulatory subunit", "On the substrate molecule", "On the surface of the ribosome"], "ans": "B", "why": "Allosteric effectors bind at sites on the regulatory subunit, separate from the active site."}, {"n": 10, "q": "In feedback inhibition of the isoleucine pathway described in the lecture, which enzyme is inhibited, and by what?", "opts": ["The last enzyme in the pathway, inhibited by threonine", "The first enzyme in the pathway, threonine dehydratase, inhibited by isoleucine", "The first enzyme, inhibited by ATP", "The middle enzyme, inhibited by NADH"], "ans": "B", "why": "Isoleucine binds the allosteric sites on threonine dehydratase, the first enzyme of the pathway, and shuts it off."}], "sa": [{"n": 11, "q": "Compare allosteric regulation with reversible covalent modification. Describe how each works, what the regulating molecule or group binds or attaches to, and what determines whether the change happens.", "a": ""}, {"n": 12, "q": "Explain how feedback inhibition works in the lecture's isoleucine pathway, from threonine to isoleucine, including what triggers the pathway to shut down and what allows it to restart.", "a": ""}, {"n": 13, "q": "Explain what the lecture means by saying enzyme regulation is \"all about shape,\" and why the lecturer says regulation is usually not all or nothing.", "a": ""}]}, {"num": 4, "title": "Coupling Endergonic and Exergonic Reactions", "guide": "<h1 id=\"lecture-4-study-guide-coupling-endergonic-and-exergonic-reactions\">Lecture 4 Study Guide: Coupling Endergonic and Exergonic Reactions</h1>\n<h2 id=\"catabolism-and-anabolism\">Catabolism and anabolism</h2>\n<p>The lecture introduces metabolism through two broad categories of pathways. Catabolism breaks down biological molecules, such as the carbohydrates, fats, and proteins in food. When these are oxidized completely, they yield carbon dioxide and water, and the energy extracted is captured in high-energy intermediates such as ATP and NADH, which power the cell. Anabolism, or biosynthesis, builds new molecules, and it uses the high-energy intermediates produced by catabolism. Some carbon atoms are not fully oxidized but are instead diverted into biosynthesis.</p>\n<p>Catabolic and anabolic pathways share central intermediates. Breakdown of different foods produces the same intermediates, such as acetyl-CoA and pyruvate, and these can then be used to build new molecules. The lecturer notes that not all anabolism and catabolism meet at acetyl-CoA, and that some connect at other points in the citric acid cycle. The citric acid cycle is presented as a central hub of metabolism, to be covered in a later lecture.</p>\n<h2 id=\"atp-as-the-immediate-energy-currency\">ATP as the immediate energy currency</h2>\n<p>ATP, adenosine triphosphate, is the immediate energy currency of cells in all forms of life, from plants and animals to microbes that do not use oxygen. Cells need ATP to power reactions and maintain homeostasis.</p>\n<p>ATP has three components. The base is adenine, which carries an amino group that can act as a weak base. The five-carbon sugar is ribose, which makes ATP a ribonucleotide; DNA nucleotides use deoxyribose instead. A nucleoside is a base plus sugar, so adenosine is adenine plus ribose. A nucleotide has at least one phosphate attached, so AMP has one phosphate, ADP has two, and ATP has three. The phosphates are named alpha (closest to the sugar), beta, and gamma (farthest from the sugar). Most reactions that ATP powers involve removing the gamma phosphate.</p>\n<p>The energy in ATP is stored in its phosphate bonds. The four oxygens carry negative charges that are pressed into a small space, creating strong charge repulsion. This puts strain on the phosphorus-oxygen bonds, so they hold a large amount of enthalpy. The lecturer compares this to a compressed spring. Breaking one of these bonds releases a large amount of energy.</p>\n<h2 id=\"hydrolysis-of-atp-and-the-standard-free-energy-of-hydrolysis\">Hydrolysis of ATP and the standard free energy of hydrolysis</h2>\n<p>Hydrolysis of ATP, with a water molecule attacking the phosphorus and releasing free phosphate, has a standard free energy change of about -30.5 kJ per mol. Free phosphate at physiologic pH is HPO4 2-, and the lecture uses the shorthand Pi (inorganic phosphate) for it, which is acceptable on exams unless a structure is specifically requested.</p>\n<p>The lecturer makes a point of stating that cells do not hydrolyze ATP to power endergonic reactions. If ATP were simply hydrolyzed, its energy would be released as heat and not used productively. Cells do break off the gamma phosphate, but through enzyme-catalyzed mechanisms rather than hydrolysis. The standard free energy of hydrolysis is the amount of energy released when the phosphate group is removed by any mechanism. This is the value that tells you how much energy the phosphate transfer can supply to other processes.</p>\n<h2 id=\"cellular-conditions\">Cellular conditions</h2>\n<p>Cells are never at the one molar standard conditions. ATP is maintained at roughly 5 millimolar, and ADP is maintained at a much lower concentration, which pushes the reaction forward by the law of mass action. Under cellular conditions, the actual free energy change for ATP hydrolysis is closer to -50 to -65 kJ per mol, so ATP has more usable energy in the cell than the standard value suggests.</p>\n<p>The reverse reaction, adding phosphate to ADP to form ATP, has a standard free energy change of about +30.5 kJ per mol. Forward and reverse reactions have equal magnitude and opposite sign. Because this reaction is strongly endergonic, it cannot happen on its own, and no realistic concentrations of ADP and phosphate would make it occur spontaneously. The lecture states that animal cells make ATP through substrate-level phosphorylation or oxidative phosphorylation, and these processes couple ATP formation to other exergonic processes.</p>\n<h2 id=\"coupling-endergonic-to-exergonic-reactions\">Coupling endergonic to exergonic reactions</h2>\n<p>The central principle is that cells drive endergonic reactions forward by coupling them to exergonic reactions, most often the breakdown of ATP. Whenever something is being made to go energetically uphill, an endergonic process is being powered by an exergonic process. The overall standard free energy change of a coupled reaction is the sum of the standard free energy changes of its parts, and the overall equilibrium constant is the product of the individual equilibrium constants.</p>\n<p>The lecture\u2019s example is glutamine synthesis. Adding free ammonia to the R group of glutamate to form glutamine, with water as the other product, has a standard free energy change of +24.5 kJ per mol, which is too endergonic to proceed on its own. Coupling it to the breakdown of ATP, which has a standard free energy change of -30.5 kJ per mol, gives a coupled reaction with a standard free energy change of -6 kJ per mol, which is favorable. In the coupled reaction, the oxygen from the carboxylate ends up on the free phosphate, so water is not drawn as a product. The lecturer gives the equilibrium constants as about 5 times 10 to the minus 5 for the endergonic step and about 2.2 times 10 to the 5 for the ATP breakdown step, and their product of about 11 is the equilibrium constant for the coupled reaction. The lecturer notes that this is only modestly above one but still feasible in the forward direction under cellular conditions.</p>\n<h2 id=\"how-the-enzyme-does-it-high-energy-intermediates\">How the enzyme does it: high-energy intermediates</h2>\n<p>The lecture explains the mechanism in glutamine synthetase, which the transcript spells \u201cglutamine synthase.\u201d It is a two-step process. In the first step, the gamma phosphate from ATP is transferred onto the side-chain carboxyl of glutamate, forming an acyl phosphate intermediate that remains bound to the enzyme\u2019s active site. This intermediate is high energy, and it holds the energy released by breaking the ATP. In the second step, ammonia attacks the carbonyl carbon and displaces the phosphate, forming the amide of glutamine and releasing free phosphate. Breaking the high-energy intermediate supplies the energy that drives the addition of ammonia.</p>\n<p>The lecturer\u2019s general rule is that whenever ATP powers an enzyme-catalyzed endergonic reaction, there is a high-energy intermediate that carries the energy from ATP to the substrate. Sometimes the intermediate is derived from the substrate, as with the acyl phosphate here. In other cases, the gamma phosphate attaches to a lysine side chain in the enzyme\u2019s own active site, and the enzyme then transfers that high-energy phosphate onto the substrate.</p>\n<p>The lecture closes by noting that coupling is not always to ATP breakdown; other exergonic processes can also drive endergonic reactions. The next lecture covers how cells harness energy from oxidizing foodstuffs to make ATP.</p>\n", "mc": [{"n": 1, "q": "What does catabolism refer to in the lecture?", "opts": ["Building new biological molecules using ATP", "The breakdown of biological molecules, extracting energy from them", "Hydrolysis of ATP to heat", "The formation of peptide bonds during protein synthesis"], "ans": "B", "why": "Catabolism is the breakdown of biological molecules, which releases energy stored in them."}, {"n": 2, "q": "Which sugar is found in ATP, making it a ribonucleotide?", "opts": ["Deoxyribose", "Glucose", "Ribose", "Fructose"], "ans": "C", "why": "ATP contains ribose, which makes it a ribonucleotide; DNA nucleotides contain deoxyribose."}, {"n": 3, "q": "Which phosphate of ATP is usually removed to power the reactions that ATP drives in the cell?", "opts": ["Alpha", "Beta", "Gamma", "All three equally"], "ans": "C", "why": "Most ATP-powered reactions remove the gamma phosphate, the one farthest from the sugar."}, {"n": 4, "q": "What is the main reason the lecture gives for the large amount of energy stored in ATP's phosphate bonds?", "opts": ["Ionic bonds between the base and sugar", "Strong charge repulsion among the closely packed negative charges on the phosphate oxygens", "Hydrogen bonds between adenine and ribose", "Disulfide bonds linking the phosphates"], "ans": "B", "why": "The four negative charges on the oxygens are pressed together, creating strong repulsion and strain on the phosphorus-oxygen bonds."}, {"n": 5, "q": "What is the standard free energy change for hydrolysis of ATP, as given in the lecture?", "opts": ["About -6 kJ per mol", "About -13.8 kJ per mol", "About -30.5 kJ per mol", "About +24.5 kJ per mol"], "ans": "C", "why": "The standard free energy change for ATP hydrolysis is about -30.5 kJ per mol."}, {"n": 6, "q": "Why does the lecture say cells do not power endergonic reactions by hydrolyzing ATP?", "opts": ["Hydrolysis makes ATP too stable to use", "The energy from simple hydrolysis would be lost as heat rather than used productively", "Hydrolysis produces only ADP, which cannot be recycled", "Hydrolysis requires a metal cofactor the cell does not have"], "ans": "B", "why": "Simple hydrolysis releases the energy as heat, so the energy is not used for useful work."}, {"n": 7, "q": "Under cellular conditions, the lecture says ATP's actual free energy of hydrolysis is closer to which range?", "opts": ["-5 to -10 kJ per mol", "-50 to -65 kJ per mol", "+30 to +50 kJ per mol", "Exactly -30.5 kJ per mol"], "ans": "B", "why": "Under cellular conditions, the actual free energy change is about -50 to -65 kJ per mol."}, {"n": 8, "q": "Adding phosphate to ADP to form ATP has a standard free energy change of about +30.5 kJ per mol. What does this imply?", "opts": ["The reaction is spontaneous at standard conditions", "The reaction cannot happen on its own and must be coupled to an exergonic process", "The reaction is an isomerization", "The reaction is favored by high ADP concentrations"], "ans": "B", "why": "A strongly positive value means the reaction cannot occur on its own, so the cell must couple it to an exergonic process."}, {"n": 9, "q": "The endergonic glutamine synthesis step (+24.5 kJ per mol) is coupled to ATP breakdown (-30.5 kJ per mol). What is the standard free energy change of the coupled reaction?", "opts": ["+55 kJ per mol", "+6 kJ per mol", "-6 kJ per mol", "-55 kJ per mol"], "ans": "C", "why": "Standard free energy changes add: +24.5 + (-30.5) = -6 kJ per mol."}, {"n": 10, "q": "In glutamine synthetase, what is the high-energy intermediate that carries energy from ATP?", "opts": ["A disulfide-linked glutamate dimer", "An acyl phosphate intermediate that remains bound to the enzyme", "A free ammonia molecule bonded to ATP", "A peptide bond linking glutamate and glutamine"], "ans": "B", "why": "An acyl phosphate intermediate forms on the substrate and stays bound to the enzyme, carrying the energy from ATP."}], "sa": [{"n": 11, "q": "Using the glutamine example, explain how coupling makes an endergonic reaction proceed in the forward direction. Include the standard free energy values, how they combine, and how the equilibrium constants combine.", "a": ""}, {"n": 12, "q": "Describe the two-step mechanism by which glutamine synthetase uses ATP to add ammonia to glutamate. Identify where the energy from ATP is temporarily stored, and explain how it is used.", "a": ""}, {"n": 13, "q": "Explain why ATP is used as the energy currency, referring to its structure, the energy stored in its phosphate bonds, and why ADP + Pi to ATP cannot happen on its own in the cell.", "a": ""}]}, {"num": 5, "title": "Biological Oxidation-Reduction Reactions", "guide": "<h1 id=\"bimm-100-lecture-5-study-guide-biological-oxidation-reduction-reactions\">BIMM 100 Lecture 5 Study Guide: Biological Oxidation-Reduction Reactions</h1>\n<h2 id=\"why-oxidation-matters\">Why oxidation matters</h2>\n<p>Catabolic pathways oxidize foodstuffs to provide energy for the cell. Unless an organism carries out photosynthesis, all of its usable energy comes from the oxidation of biological molecules. For animals, oxidation of carbon atoms is the only way to obtain energy to make ATP. The lecture focuses on carbohydrates as the introductory example, but the same principles apply to proteins and fats.</p>\n<h2 id=\"combustion-versus-biological-oxidation\">Combustion versus biological oxidation</h2>\n<p>Burning one mole of glucose by combustion consumes six O2 and produces six CO2 and six H2O. The standard free energy change is -2,840 kJ/mol. Animals do not oxidize glucose by combustion. They oxidize it in a stepwise, controlled process that lets them capture energy for ATP. The end products are the same, and the standard free energy change is the same (-2,840 kJ/mol) regardless of the route. Biological oxidation is not perfectly efficient: some energy is lost as heat, but a large part is used to make ATP. For comparison, the lecture gives the standard free energy change for breaking one ATP as -30.5 kJ/mol, so making one ATP requires an input of +30.5 kJ/mol.</p>\n<p>The lecture also notes that the number of water molecules produced differs between the two routes. In biological oxidation, the lecture gives 10 to 12 water molecules per mole of glucose, depending on how the bookkeeping is done. This will be revisited in oxidative phosphorylation.</p>\n<h2 id=\"oxidation-states-of-carbon\">Oxidation states of carbon</h2>\n<p>Oxidizing a biological molecule means oxidizing its carbon atoms, which means pulling electrons out of them. Electrons are removed mainly as hydrogen atoms (dehydrogenation). The more reduced a carbon atom is (the lower its oxidation state), the more electrons it can donate and the more energy it can yield when oxidized. Students are not asked to calculate oxidation states on exams. They are expected to compare carbons in different chemical groups and identify which carbon is the most reduced (lowest oxidation state) and which is the most oxidized. The lecturer\u2019s wording on this point is confusing (see the caveats below).</p>\n<h2 id=\"oxidoreductase-enzymes\">Oxidoreductase enzymes</h2>\n<p>Enzymes that catalyze oxidation-reduction reactions are oxidoreductases. There are two types, distinguished by what receives the electrons.</p>\n<p>Oxidases transfer electrons from an organic substrate to molecular oxygen, which is the electron acceptor and is often reduced to water. The lecture\u2019s example is cytochrome c oxidase, the last complex in the electron transport chain. It takes electrons from cytochrome c and passes them to oxygen, reducing it to water.</p>\n<p>Dehydrogenases remove hydrogen atoms from a substrate. This is not dehydration: no water is removed. Electrons move as a hydride ion (two electrons plus a proton) or as a pair of hydrogen atoms, and the lecture stresses that biological redox reactions generally involve movement of pairs of electrons. Dehydrogenases play the central role in the pathways covered in this course. The lecture\u2019s example is lactate dehydrogenase, which converts lactate to pyruvate and transfers the hydride to NAD+ to form NADH. The lecture points out that lactate is a player in fermentation, which is covered in Lecture 7.</p>\n<h2 id=\"electron-carriers-nad-nadp-and-fad\">Electron carriers: NAD, NADP, and FAD</h2>\n<p>NAD+ (nicotinamide adenine dinucleotide) is the general electron carrier. It shuttles electrons between enzymes and between cellular compartments and helps maintain the redox state of the cell. It is written as NAD+ + 2 e- + 2 H+ \u21cc NADH + H+. The reaction is reversible. In dehydrogenase reactions, the hydride is transferred to NAD+, and an additional proton is often released to solution because of how the electrons rearrange. The lecturer notes that this is not always the case, but the equation is written this way because it is common. NAD+ is a substrate, not a permanently bound group. It leaves the enzyme as NADH, diffuses through the cell, and is reoxidized to NAD+ at another enzyme. NADH is the predominant electron carrier in catabolic pathways.</p>\n<p>NADP+ is nearly identical to NAD+ but has one additional phosphate group. NADPH is used almost exclusively to supply electrons for biosynthesis (reductive, anabolic reactions). NAD and NADP pools exist in both oxidized and reduced forms, and the cytoplasm and mitochondria maintain separate NAD pools. Cells contain very large numbers of these molecules, so both forms are always present.</p>\n<p>FAD (flavin adenine dinucleotide) differs from NAD in two important ways. First, it accepts two separate hydrogen atoms (each contributing one proton and one electron) rather than a hydride ion. Second, FAD is a prosthetic group: it is permanently bound at the enzyme\u2019s active site and never leaves. Electrons pass out of the substrate, through FAD, and on to another acceptor. Proteins that use FAD as a prosthetic group are called flavoproteins. The lecture says FAD will come up again in the pyruvate dehydrogenase complex.</p>\n<p>Structure recognition: the lecturer expects students to recognize the structures of ATP, NAD, and FAD side by side, and to know what composes them. NAD is two nucleotides, one containing adenine (AMP-based) and one containing nicotinamide. The nicotinamide ring is the business end where hydride is added. FAD is also a dinucleotide built on an AMP-like unit and a flavin (isoalloxazine) ring system, where the two hydrogens attach. Students are not expected to draw these structures from scratch.</p>\n<p>The lecture notes that humans cannot synthesize all parts of NAD and FAD, so these coenzymes require vitamins (niacin, vitamin B3, for the nicotinamide portion of NAD, and riboflavin, vitamin B2, for FAD). The lecturer explicitly said the vitamin details will not be on the test.</p>\n<h2 id=\"reduction-potential-and-direction-of-electron-flow\">Reduction potential and direction of electron flow</h2>\n<p>Whether a redox reaction proceeds in a given direction depends on reactant and product concentrations and on its thermodynamic favorability. Thermodynamic favorability is governed by reduction potential, which is the pull a molecule has on electrons, measured in volts. Under standard conditions, the change in reduction potential is \u0394E\u2019\u00b0, calculated as the reduction potential of the electron acceptor minus that of the electron donor. A positive \u0394E\u2019\u00b0 means the acceptor pulls harder on electrons than the donor, so electrons flow from donor to acceptor. This corresponds to a negative standard free energy change, which is thermodynamically favorable. The reverse situation gives a positive \u0394G and an unfavorable reaction. Some oxidations, such as lactate dehydrogenase, are reversible. Others are so exergonic that they effectively cannot run in reverse. The lecturer defers the full treatment to the electron transport chain lecture.</p>\n<h2 id=\"key-points-to-remember\">Key points to remember</h2>\n<ul>\n<li>Animals and other non-photosynthetic organisms get all usable energy from oxidizing biological molecules.</li>\n<li>Glucose combustion and biological oxidation have the same standard free energy change (-2,840 kJ/mol), but biological oxidation is stepwise and captures energy as ATP.</li>\n<li>Dehydrogenases remove hydrogen (as hydride or as H atoms). Oxidases transfer electrons to O2.</li>\n<li>NAD+ and NADP+ accept hydride ions. NAD+ is used mainly in catabolism; NADPH is used mainly in biosynthesis.</li>\n<li>FAD accepts two H atoms and is a prosthetic group that stays bound to the enzyme.</li>\n<li>Electron flow direction follows reduction potential: a positive \u0394E\u2019\u00b0 means a negative \u0394G and a favorable reaction.</li>\n</ul>\n<h2 id=\"caveats-from-the-transcript\">Caveats from the transcript</h2>\n<p>The lecturer says \u201cgreatest oxidation state, meaning it is most spent,\u201d then says the more reduced a carbon is, the more energy it has to yield. Since the most reduced carbon has the lowest oxidation state, the intended meaning is likely that the lowest oxidation state carbon is the most energy-rich. Check the slide or textbook before relying on the wording. The transcript also says \u201cNADP serves as the reducing potential,\u201d which appears to be a slip for NADPH. The lecturer refers to a discussion-section exercise on oxidation states that is not in the transcript.</p>\n", "mc": [{"n": 1, "q": "What is the standard free energy change for the complete combustion of one mole of glucose to CO2 and water, as given in the lecture?", "opts": ["-30.5 kJ/mol", "-146 kJ/mol", "-2,840 kJ/mol", "-43 kJ/mol"], "ans": "C", "why": "The lecture gives -2,840 kJ/mol for combustion, which is the same value for biological oxidation."}, {"n": 2, "q": "Compared with combustion, how does the lecture describe biological oxidation of glucose?", "opts": ["It releases much less total energy and produces different end products.", "It has the same standard free energy change and the same end products, but proceeds in a stepwise, controlled way that lets part of the energy be captured as ATP.", "It has a positive standard free energy change, so it does not occur spontaneously.", "It does not require any enzymes."], "ans": "B", "why": "The lecture says the standard free energy change is the same, and the end products are the same. Biological oxidation is stepwise and captures much of the energy for ATP, with some lost as heat."}, {"n": 3, "q": "Which type of oxidoreductase transfers electrons from an organic substrate to molecular oxygen, which is reduced (often to water)?", "opts": ["Dehydrogenase", "Oxidase", "Kinase", "Isomerase"], "ans": "B", "why": "Oxidases use molecular oxygen as the electron acceptor. Cytochrome c oxidase is the lecture's example."}, {"n": 4, "q": "Which statement best describes a dehydrogenase?", "opts": ["It removes a water molecule from a substrate.", "It removes hydrogen atoms (as a hydride ion or a pair of H atoms) from a substrate.", "It adds a phosphate group from ATP to a substrate.", "It transfers electrons to molecular oxygen."], "ans": "B", "why": "Dehydrogenases remove hydrogen, not water. The lecturer stresses that this is not dehydration."}, {"n": 5, "q": "In the lactate dehydrogenase reaction, lactate is converted to pyruvate. Where do the electrons from lactate go?", "opts": ["Directly to molecular oxygen", "To FAD, which stays bound to the enzyme", "To NAD+, forming NADH", "To ATP, forming ADP"], "ans": "C", "why": "The hydride ion is transferred to NAD+, producing NADH (plus an H+)."}, {"n": 6, "q": "Which electron carrier is used predominantly to supply electrons for biosynthetic (anabolic) reactions?", "opts": ["NAD+", "NADH", "NADPH", "FADH2"], "ans": "C", "why": "NADPH supplies electrons for biosynthesis. NAD+ and NADH are used mainly in catabolism."}, {"n": 7, "q": "How does FAD differ from NAD+ as an electron carrier?", "opts": ["FAD accepts a hydride ion, while NAD+ accepts two separate H atoms.", "FAD accepts two separate hydrogen atoms and is a prosthetic group that stays permanently bound to the enzyme's active site.", "FAD leaves the enzyme and diffuses through the cell, while NAD+ stays bound.", "FAD is used only in biosynthesis."], "ans": "B", "why": "FAD accepts two hydrogen atoms and is a prosthetic group that never leaves the enzyme. NAD+ accepts a hydride ion and is a substrate that diffuses away."}, {"n": 8, "q": "A redox reaction has a positive change in reduction potential (\u0394E'\u00b0 > 0). According to the lecture, what does this mean?", "opts": ["The reaction has a positive standard free energy change and is unfavorable.", "The reaction has a negative standard free energy change and is thermodynamically favorable, with electrons flowing from the donor to the acceptor that pulls on them more strongly.", "The electron donor has a greater pull on electrons than the acceptor.", "The reaction cannot be reversed under any conditions."], "ans": "B", "why": "A positive \u0394E'\u00b0 corresponds to a negative \u0394G, which is favorable, and electrons move from the donor toward the acceptor with the greater pull."}, {"n": 9, "q": "According to the lecture, which carbon atom in a biological molecule has the most energy to yield upon oxidation?", "opts": ["The most oxidized carbon, which has the highest oxidation state", "The most reduced carbon, which has the lowest oxidation state and the most electrons to donate", "Any carbon bonded to oxygen", "The carbon that forms CO2 first"], "ans": "B", "why": "The most reduced carbon has the lowest oxidation state and the most electrons to donate in oxidation reactions."}, {"n": 10, "q": "The lecture states that the standard free energy of breaking one ATP is -30.5 kJ/mol. Which statement follows from this?", "opts": ["Making one ATP from ADP and phosphate releases 30.5 kJ/mol.", "Making one ATP from ADP and phosphate requires an input of about +30.5 kJ/mol.", "ATP has no energetic role in biological oxidation.", "ATP is produced by combustion, not by biological oxidation."], "ans": "B", "why": "Making ATP is endergonic by +30.5 kJ/mol, so it requires energy input, which the lecture ties to the oxidation process."}], "sa": [{"n": 11, "q": "Explain why complete combustion of glucose and biological oxidation of glucose have the same standard free energy change, and describe what differs between the two processes.", "a": "Both processes start with the same reactants and end with the same products (six CO2 and six H2O from one glucose plus six O2). Standard free energy is a state function, so it depends only on the start and end states, and it is -2,840 kJ/mol either way. What differs is the route. Combustion releases all the energy as heat in one step. Biological oxidation proceeds through many controlled steps, so energy can be captured and used to make ATP, though some is still lost as heat."}, {"n": 12, "q": "Describe the difference between oxidases and dehydrogenases. Give one example of each from the lecture and state what the electron acceptor is in each case.", "a": "Oxidases transfer electrons from an organic substrate to molecular oxygen, which is the electron acceptor and is often reduced to water. The lecture's example is cytochrome c oxidase, which passes electrons from cytochrome c to oxygen at the end of the electron transport chain. Dehydrogenases remove hydrogen atoms, as a hydride ion or a pair of H atoms, from a substrate and transfer them to an electron carrier such as NAD+. The lecture's example is lactate dehydrogenase, which converts lactate to pyruvate and reduces NAD+ to NADH. Dehydrogenases are the main type in the metabolic pathways covered in the course."}, {"n": 13, "q": "Compare NAD+ and FAD as electron carriers. Address how each accepts electrons (hydride ion or hydrogen atoms) and whether each leaves the enzyme or remains bound.", "a": "NAD+ accepts a hydride ion (two electrons and a proton), often with an additional proton released to solution, and it is written as NAD+ + 2e- + 2H+ giving NADH + H+. NAD+ is a substrate that leaves the enzyme as NADH, diffuses through the cell, and is reoxidized at another enzyme. FAD accepts two separate hydrogen atoms, each contributing one proton and one electron, to form FADH2. FAD is a prosthetic group that stays permanently bound at the active site, and electrons pass through it to another acceptor."}]}, {"num": 6, "title": "Glycolysis", "guide": "<h1 id=\"bimm-100-lecture-6-study-guide-glycolysis\">BIMM 100 Lecture 6 Study Guide: Glycolysis</h1>\n<h2 id=\"overview\">Overview</h2>\n<p>Glycolysis is the first metabolic pathway covered and is the initial oxidation of glucose for energy. It is the first step in the catabolism of carbohydrates. It does not require oxygen, so it can run under anaerobic conditions. Completing glucose oxidation to CO2 and water through cellular respiration does require oxygen. Glycolysis is ancient: it evolved before oxygen accumulated in the atmosphere, which was produced by photosynthesis. Most organisms carry it out, and each reaction is essentially the same across organisms that have it. In eukaryotes, glycolysis occurs in the cytoplasm, while cellular respiration occurs in the mitochondria.</p>\n<p>In summary, one glucose (six carbons) is split into two pyruvate (three carbons). The pathway yields a net 2 ATP and 2 NADH per glucose. Ten reactions make up the pathway. Seven of them are reversible under physiological conditions and run in reverse during glucose synthesis from two pyruvate. Three are irreversible: hexokinase, phosphofructokinase, and pyruvate kinase.</p>\n<h2 id=\"carbohydrate-nomenclature\">Carbohydrate nomenclature</h2>\n<p>Carbohydrates have a hydroxyl group on each carbon. When one carbon becomes a carbonyl, the molecule changes name: glycerol (three hydroxyls) becomes glyceraldehyde when an aldehyde forms at one end, and glycerate when that aldehyde becomes a carboxylate. Carbons are always numbered starting from the carbonyl end.</p>\n<p>Glucose is a hexose (six carbons) and an aldohexose, because its carbonyl at carbon 1 is an aldehyde. The carbonyl carbon is called the anomeric carbon and is chemically more reactive. In solution, about 10% of glucose is in the linear form, and the rest is in equilibrium with a ring form (a hemiacetal). The ring forms when the oxygen on carbon 5 attacks carbon 1. The ring can have the carbon 1 hydroxyl pointing down (alpha) or up (beta). By the lecturer\u2019s convention, with carbon 6 drawn sticking up, the alpha form has the carbon 1 hydroxyl pointing down. Enzymes in glycolysis recognize the alpha form, so all reactions in the pathway use alpha-D-glucose.</p>\n<p>Fructose is a ketohexose, because its carbonyl is a ketone at carbon 2. Its ring forms when the carbon 5 oxygen attacks carbon 2. The alpha form of fructose is used in glycolysis.</p>\n<h2 id=\"expectations-for-the-pathway\">Expectations for the pathway</h2>\n<p>The lecturer expects students to know glycolysis in detail: the structure of each intermediate, the name of each intermediate, and the name of each enzyme. Students do not need catalytic mechanisms. Students also do not need to memorize standard free energy changes, though the lecture gives them. The lecturer suggests learning the structure of glucose first, since the enzyme names and intermediate names follow from what each reaction does. A kinase transfers a phosphate from ATP. An isomerase rearranges a molecule. A mutase is a type of isomerase that moves a phosphate. A lyase removes a group to form a double bond. A dehydrogenase removes hydrogen, usually to NAD+.</p>\n<h2 id=\"the-ten-reactions\">The ten reactions</h2>\n<p>Steps 1 through 5 form the preparatory phase, in which two ATP are spent to prepare the six-carbon sugar for splitting. Steps 6 through 10 form the payoff phase, in which ATP and NADH are made.</p>\n<ol type=\"1\">\n<li><p>Hexokinase phosphorylates glucose on carbon 6 using ATP, producing glucose 6-phosphate and ADP. The standard free energy change is -16.7 kJ/mol, and the reaction is irreversible. Phosphorylation traps glucose inside the cell. Animal cells take up glucose through GLUT transporters by facilitated diffusion, which can run in either direction. Once phosphorylated, glucose cannot leave through those transporters. Hexokinase has a low Km for glucose, so most tissues phosphorylate glucose even at low concentrations. Glucokinase is an isozyme (a different protein that catalyzes the same reaction) found in the liver and in pancreatic beta cells. It has a higher Km and responds over a broader, higher range of glucose concentrations.</p></li>\n<li><p>Phosphohexose isomerase converts glucose 6-phosphate to fructose 6-phosphate. This is a simple isomerization with a standard free energy change of +1.7 kJ/mol, so it is reversible and near neutral.</p></li>\n<li><p>Phosphofructokinase (PFK) phosphorylates fructose 6-phosphate on carbon 1 using a second ATP, producing fructose 1,6-bisphosphate and ADP. The standard free energy change is -14.2 kJ/mol, and the reaction is irreversible. PFK is highly regulated by allosteric mechanisms and serves as the gateway for carbon entering glycolysis. The lecturer explains why regulation is at PFK and not at hexokinase: glucose 6-phosphate can enter several pathways, so hexokinase must always run. The second ATP is spent only once the carbon is committed to glycolysis.</p></li>\n<li><p>Aldolase cleaves fructose 1,6-bisphosphate into dihydroxyacetone phosphate (DHAP) and glyceraldehyde 3-phosphate (G3P). It is the reverse of an aldol condensation. The standard free energy change is +22.8 kJ/mol, which is endergonic under standard conditions. The lecturer says the reaction is feasible in the cell, partly because splitting one reactant into two products makes the mass action ratio favor the forward direction.</p></li>\n<li><p>Triose phosphate isomerase converts DHAP into G3P by moving the carbonyl. After this step, two G3P molecules exist for each glucose. The transcript does not give a standard free energy value for this step.</p></li>\n<li><p>Glyceraldehyde 3-phosphate dehydrogenase is the most important step in the lecturer\u2019s view. It oxidizes the aldehyde of G3P to a carboxylic acid-type acyl group. A hydride is transferred to NAD+ to form NADH, and inorganic phosphate from solution is added to carbon 1, forming 1,3-bisphosphoglycerate. The hydride transfer alone has a standard free energy change of -43 kJ/mol. The overall reaction, including phosphate addition, is +6 kJ/mol, so it is slightly endergonic but reversible. The energy from the oxidation is retained in the high-energy acyl phosphate of 1,3-bisphosphoglycerate. This step produces 2 NADH per glucose.</p></li>\n<li><p>Phosphoglycerate kinase transfers the phosphate from 1,3-bisphosphoglycerate to ADP, forming ATP and 3-phosphoglycerate. The standard free energy change is -18.8 kJ/mol. The reaction is reversible. This is the first substrate-level phosphorylation step and yields 2 ATP per glucose.</p></li>\n<li><p>Phosphoglycerate mutase moves the phosphate from carbon 3 to carbon 2, forming 2-phosphoglycerate. The standard free energy change is +4.4 kJ/mol.</p></li>\n<li><p>Enolase is a lyase. It removes water from 2-phosphoglycerate to form a double bond, producing phosphoenolpyruvate (PEP). The standard free energy change is +7.5 kJ/mol, so it is modestly endergonic but easily pushed in either direction by concentrations. The key effect is that the phosphate on PEP is held in the enol form and has a standard free energy of hydrolysis of -61.9 kJ/mol, compared with -17.6 kJ/mol for the phosphate on 2-phosphoglycerate. This redistribution of energy makes the next ATP-generating step possible.</p></li>\n<li><p>Pyruvate kinase transfers the phosphate from PEP to ADP, forming ATP and the enol form of pyruvate. The enol spontaneously tautomerizes to the lower-energy keto form, which is pyruvate, the end product of glycolysis. The standard free energy change is -31.4 kJ/mol, and the reaction is irreversible. This is the second substrate-level phosphorylation step and yields 2 ATP per glucose.</p></li>\n</ol>\n<h2 id=\"energy-accounting\">Energy accounting</h2>\n<p>For each glucose, two ATP are spent (steps 1 and 3). Four ATP are produced (steps 7 and 10, each occurring twice), for a net gain of 2 ATP. Step 6 produces 2 NADH. The lecturer summarizes the net energy payoff as 2 ATP and 2 NADH per glucose.</p>\n<p>The oxidation of glucose to pyruvate releases about -146 kJ/mol of exergonic energy, mostly at step 6. For comparison, complete oxidation of glucose to CO2 and water releases -2,840 kJ/mol. Glycolysis extracts only a small part of that energy, and most of the remainder is extracted in cellular respiration.</p>\n<h2 id=\"atp-production-mechanisms\">ATP production mechanisms</h2>\n<p>The lecturer describes three ways cells make ATP. Substrate-level phosphorylation transfers a phosphate from a high-energy intermediate to ADP, as in steps 7 and 10. It does not require oxygen. Oxidative phosphorylation uses the electron transport chain and ATP synthase in mitochondria, and it requires oxygen. Photophosphorylation uses sunlight in the light reactions of photosynthesis. It is not covered in this course.</p>\n<h2 id=\"key-points-to-remember\">Key points to remember</h2>\n<ul>\n<li>Glycolysis occurs in the cytoplasm, does not require oxygen, and converts one glucose to two pyruvate.</li>\n<li>Net yield per glucose: 2 ATP and 2 NADH.</li>\n<li>Irreversible steps: hexokinase, PFK (the regulated gateway), and pyruvate kinase.</li>\n<li>The two substrate-level phosphorylation steps are phosphoglycerate kinase and pyruvate kinase.</li>\n<li>Enolase converts 2-phosphoglycerate to PEP, which raises the phosphate\u2019s free energy of hydrolysis enough to make ATP.</li>\n<li>The lecturer asks students to learn structures, intermediate names, and enzyme names, not catalytic mechanisms or free energy values.</li>\n</ul>\n<h2 id=\"caveats-from-the-transcript\">Caveats from the transcript</h2>\n<p>The transcript says the net standard free energy change for all of glycolysis is \u201ca negative 146 plus a plus 61\u201d kJ/mol. It does not state the summed value. The lecture\u2019s stated step values do not clearly add up to +61. The -146 figure refers to the exergonic steps only. Check this number against the textbook or slides before using it. The lecturer also refers to \u201cLeninger,\u201d which is presumably Lehninger.</p>\n", "mc": [{"n": 1, "q": "Where in a eukaryotic cell does glycolysis occur?", "opts": ["Mitochondrial matrix", "Cytoplasm", "Nucleus", "Endoplasmic reticulum"], "ans": "B", "why": "Glycolysis occurs in the cytoplasm. Cellular respiration occurs in the mitochondria."}, {"n": 2, "q": "What is the net energy payoff of glycolysis per glucose molecule, according to the lecture?", "opts": ["2 ATP and 2 NADH", "4 ATP and 2 NADH", "2 ATP and 0 NADH", "30 to 32 ATP"], "ans": "A", "why": "Two ATP (net) and two NADH per glucose."}, {"n": 3, "q": "Which enzyme is the regulated gateway for carbon entering glycolysis?", "opts": ["Hexokinase", "Phosphofructokinase", "Aldolase", "Enolase"], "ans": "B", "why": "The lecture calls PFK the regulated entry point and gateway to glycolysis."}, {"n": 4, "q": "Which three steps of glycolysis are irreversible?", "opts": ["Hexokinase, phosphofructokinase, and pyruvate kinase", "Hexokinase, aldolase, and pyruvate kinase", "Phosphohexose isomerase, aldolase, and enolase", "Glyceraldehyde 3-phosphate dehydrogenase, phosphoglycerate kinase, and enolase"], "ans": "A", "why": "Hexokinase, PFK, and pyruvate kinase are the three irreversible steps."}, {"n": 5, "q": "Which tissues does the lecture say use glucokinase, a hexokinase isozyme with a higher Km for glucose?", "opts": ["Skeletal muscle and brain", "Liver and pancreatic beta cells", "Red blood cells and kidney", "Adipose tissue and heart"], "ans": "B", "why": "The lecture names the liver and pancreatic beta cells as using gl
